<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --bg-surface: #0f172a;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --border-color: #e2e8f0;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --warning-bg: #fef3c7;
      --warning-text: #92400e;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: var(--text-main);
      padding-top: 20px;
      padding-bottom: 40px;
    }

    .app-container {
      max-width: 520px;
      margin: 0 auto;
    }

    .card-custom {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
      padding: 28px 24px;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text-main);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .form-select, .form-control {
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      padding: 10px 14px;
      font-size: 0.95rem;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .form-select:focus, .form-control:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .form-select:disabled {
      background-color: #f1f5f9;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .segmented-control {
      display: flex;
      background-color: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .segmented-control input[type="radio"] {
      display: none;
    }

    .segmented-control label {
      flex: 1;
      text-align: center;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }

    .segmented-control input[type="radio"]:checked + label {
      background-color: var(--accent-color);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .btn-submit {
      background-color: var(--accent-color);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 1rem;
      color: #ffffff;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .status-online { background-color: var(--success-bg); color: var(--success-text); }
    .status-offline { background-color: var(--warning-bg); color: var(--warning-text); }

    /* GPS Box Styling */
    .gps-container {
      background: #f8fafc;
      border: 1.5px dashed var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
    }

    .gps-container.locked {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .gps-text {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .gps-subtext {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Modern Popup Modal */
    .popup-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      padding: 20px;
    }

    .popup-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      transform: scale(0.9);
      transition: all 0.25s ease;
    }

    .popup-backdrop.active .popup-card {
      transform: scale(1);
    }

    .popup-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .popup-error .popup-icon { background: #fee2e2; color: #dc2626; }
    .popup-success .popup-icon { background: #dcfce7; color: #166534; }

    .popup-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      width: 100%;
      margin-top: 16px;
    }

    .popup-error .popup-btn { background: #dc2626; color: white; }
    .popup-success .popup-btn { background: #166534; color: white; }
  </style>
</head>
<body>

<div class="container app-container">

  <!-- Status Bar Header -->
  <div class="d-flex justify-content-between align-items-center mb-3 px-1">
    <span id="networkStatus" class="status-badge status-online">● Online</span>
    <span id="queueStatus" class="badge bg-secondary rounded-pill d-none">0 Pending Sync</span>
  </div>

  <div class="card-custom">
    <div class="text-center mb-4">
      <h4 class="fw-bold m-0" style="color: var(--text-main);">Attendance Tracker</h4>
      <p class="text-muted small m-0 mt-1">Cascading location & real GPS lock</p>
    </div>

    <!-- Live GPS Coordinates Box -->
    <div id="gpsBox" class="gps-container mb-4">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <div class="gps-text" id="gpsStatusText">📍 Acquiring Location...</div>
          <div class="gps-subtext" id="gpsCoordinates">Tap 'Acquire GPS' if prompt appears</div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary fw-bold" onclick="requestGPSCoordinates()">Acquire GPS</button>
      </div>
    </div>

    <form id="attendanceForm">
      
      <!-- 1. Project -->
      <div class="mb-3">
        <label class="form-label">Project <span class="text-danger">*</span></label>
        <select id="project" class="form-select" onchange="onProjectChange()" required>
          <option value="">-- Select Project --</option>
        </select>
      </div>

      <!-- 2. Organization -->
      <div class="mb-3">
        <label class="form-label">Organization <span class="text-danger">*</span></label>
        <select id="organization" class="form-select" onchange="onOrganizationChange()" required disabled>
          <option value="">-- Select Project First --</option>
        </select>
      </div>

      <!-- 3. District -->
      <div class="mb-3">
        <label class="form-label">District <span class="text-danger">*</span></label>
        <select id="district" class="form-select" onchange="onDistrictChange()" required disabled>
          <option value="">-- Select Organization First --</option>
        </select>
      </div>

      <!-- 4. Union Council -->
      <div class="mb-3">
        <label class="form-label">Union Council <span class="text-danger">*</span></label>
        <select id="unionCouncil" class="form-select" onchange="onUnionCouncilChange()" required disabled>
          <option value="">-- Select District First --</option>
        </select>
      </div>

      <!-- 5. Designation -->
      <div class="mb-3">
        <label class="form-label">Designation <span class="text-danger">*</span></label>
        <select id="designation" class="form-select" onchange="onDesignationChange()" required disabled>
          <option value="">-- Select Union Council First --</option>
        </select>
      </div>

      <!-- 6. Full Name -->
      <div class="mb-3">
        <label class="form-label">Full Name <span class="text-danger">*</span></label>
        <select id="fullName" class="form-select" onchange="onNameChange()" required disabled>
          <option value="">-- Select Designation First --</option>
        </select>
      </div>

      <!-- 7. Attendance Type -->
      <div class="mb-3">
        <label class="form-label d-block">Attendance Type <span class="text-danger">*</span></label>
        <div class="segmented-control">
          <input type="radio" name="type" id="typeIn" value="Check-In" checked>
          <label for="typeIn">Check-In</label>
          
          <input type="radio" name="type" id="typeOut" value="Check-Out">
          <label for="typeOut">Check-Out</label>
        </div>
      </div>

      <!-- 8. Remarks -->
      <div class="mb-4">
        <label class="form-label">Remarks <span class="text-muted fw-normal">(Optional)</span></label>
        <textarea id="remarks" class="form-control" rows="2" placeholder="Write any optional notes..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-submit w-100">Submit Attendance</button>
    </form>
  </div>
</div>

<!-- Modern Popup Modal -->
<div id="popupModal" class="popup-backdrop popup-error">
  <div class="popup-card text-center" tabindex="-1" id="popupCard">
    <div id="popupIcon" class="popup-icon mx-auto">!</div>
    <h5 id="popupTitle" class="fw-bold mb-2">Attention Required</h5>
    <p id="popupMessage" class="text-muted small mb-0"></p>
    <button type="button" class="popup-btn" id="popupCloseBtn" onclick="closePopup()">Acknowledge</button>
  </div>
</div>

<script>
  // INSERT YOUR DEPLOYED GOOGLE APPS SCRIPT URL HERE
  const GAS_API_URL = "YOUR_DEPLOYED_WEB_APP_URL_HERE";

  let masterRoster = [];
  let capturedLocation = null; // Stores object { lat, lng, formatted }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration error:', err));
  }

  window.addEventListener('load', () => {
    updateNetworkStatus();
    requestGPSCoordinates();
    loadRosterData();
  });

  window.addEventListener('online', updateNetworkStatus);
  window.addEventListener('offline', updateNetworkStatus);

  // --- SMART GPS ENGINE WITH FALLBACK ---
  function requestGPSCoordinates() {
    const box = document.getElementById('gpsBox');
    const statusText = document.getElementById('gpsStatusText');
    const coordsText = document.getElementById('gpsCoordinates');

    statusText.textContent = "📍 Requesting Location...";
    coordsText.textContent = "Searching for satellites / cell signal...";
    box.classList.remove('locked');

    return new Promise((resolve) => {
      if (!("geolocation" in navigator)) {
        statusText.textContent = "⚠️ GPS Not Supported";
        coordsText.textContent = "Browser does not support geolocation.";
        capturedLocation = null;
        resolve(null);
        return;
      }

      // Try High Accuracy First
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          setGPSSuccess(pos);
          resolve(capturedLocation);
        },
        (err) => {
          // Fallback to Standard Accuracy (Cellular / Wi-Fi) if high accuracy times out
          navigator.geolocation.getCurrentPosition(
            (fallbackPos) => {
              setGPSSuccess(fallbackPos);
              resolve(capturedLocation);
            },
            (finalErr) => {
              statusText.textContent = "⚠️ Location Access Denied / Failed";
              coordsText.textContent = "Please allow Location permission in browser settings.";
              capturedLocation = null;
              resolve(null);
            },
            { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
          );
        },
        { enableHighAccuracy: true, timeout: 6000, maximumAge: 10000 }
      );
    });
  }

  function setGPSSuccess(pos) {
    const lat = pos.coords.latitude.toFixed(6);
    const lng = pos.coords.longitude.toFixed(6);
    const formatted = `Lat: ${lat}, Long: ${lng}`;

    capturedLocation = { lat: lat, lng: lng, formatted: formatted };

    const box = document.getElementById('gpsBox');
    const statusText = document.getElementById('gpsStatusText');
    const coordsText = document.getElementById('gpsCoordinates');

    box.classList.add('locked');
    statusText.textContent = "✓ GPS Location Locked";
    coordsText.textContent = formatted;
  }

  function updateNetworkStatus() {
    const statusEl = document.getElementById('networkStatus');
    if (navigator.onLine) {
      statusEl.className = "status-badge status-online";
      statusEl.textContent = "● Online";
      syncOfflineQueue();
    } else {
      statusEl.className = "status-badge status-offline";
      statusEl.textContent = "● Offline Mode";
    }
    updateQueueBadge();
  }

  function updateQueueBadge() {
    const queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    const badge = document.getElementById('queueStatus');
    if (queue.length > 0) {
      badge.textContent = `${queue.length} Pending Sync`;
      badge.classList.remove('d-none');
    } else {
      badge.classList.add('d-none');
    }
  }

  // --- CASCADING DROPDOWNS ---
  function loadRosterData() {
    if (navigator.onLine) {
      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getEmployees' })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'SUCCESS' && res.employees) {
          masterRoster = res.employees;
          localStorage.setItem('employee_roster_cache', JSON.stringify(masterRoster));
          initProjectDropdown();
        } else {
          loadRosterFromCache();
        }
      })
      .catch(() => loadRosterFromCache());
    } else {
      loadRosterFromCache();
    }
  }

  function loadRosterFromCache() {
    const cache = localStorage.getItem('employee_roster_cache');
    if (cache) {
      masterRoster = JSON.parse(cache);
      initProjectDropdown();
    } else {
      showPopup("No Offline Cache", "No offline employee roster found. Connect online once to initialize.", "error");
    }
  }

  function initProjectDropdown() {
    const projects = [...new Set(masterRoster.map(e => e.project))].filter(Boolean);
    populateSelect('project', projects, '-- Select Project --');
    resetDownstream('project');
  }

  function onProjectChange() {
    const proj = document.getElementById('project').value;
    if (!proj) { resetDownstream('project'); return; }

    const filtered = masterRoster.filter(e => e.project === proj);
    const orgs = [...new Set(filtered.map(e => e.organization))].filter(Boolean);

    populateSelect('organization', orgs, '-- Select Organization --');
    document.getElementById('organization').disabled = false;
    resetDownstream('organization');
  }

  function onOrganizationChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    if (!org) { resetDownstream('organization'); return; }

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org);
    const dists = [...new Set(filtered.map(e => e.district))].filter(Boolean);

    populateSelect('district', dists, '-- Select District --');
    document.getElementById('district').disabled = false;
    resetDownstream('district');
  }

  function onDistrictChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    if (!dist) { resetDownstream('district'); return; }

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist);
    const ucs = [...new Set(filtered.map(e => e.unionCouncil))].filter(Boolean);

    populateSelect('unionCouncil', ucs, '-- Select Union Council --');
    document.getElementById('unionCouncil').disabled = false;
    resetDownstream('unionCouncil');
  }

  function onUnionCouncilChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    if (!uc) { resetDownstream('unionCouncil'); return; }

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc);
    const desigs = [...new Set(filtered.map(e => e.designation))].filter(Boolean);

    populateSelect('designation', desigs, '-- Select Designation --');
    document.getElementById('designation').disabled = false;
    resetDownstream('designation');
  }

  function onDesignationChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const desig = document.getElementById('designation').value;
    if (!desig) { resetDownstream('designation'); return; }

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc && e.designation === desig);
    const names = [...new Set(filtered.map(e => e.fullName))].filter(Boolean);

    populateSelect('fullName', names, '-- Select Full Name --');
    document.getElementById('fullName').disabled = false;
  }

  function onNameChange() {}

  function populateSelect(id, items, placeholder) {
    const el = document.getElementById(id);
    el.innerHTML = `<option value="">${placeholder}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
  }

  function resetDownstream(level) {
    const seq = ['project', 'organization', 'district', 'unionCouncil', 'designation', 'fullName'];
    const startIndex = seq.indexOf(level) + 1;

    for (let i = startIndex; i < seq.length; i++) {
      const field = document.getElementById(seq[i]);
      field.innerHTML = `<option value="">-- Select ${formatLabel(seq[i - 1])} First --</option>`;
      field.disabled = true;
      field.value = "";
    }
  }

  function formatLabel(s) {
    return s.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
  }

  // --- SAME DAY RULES VALIDATION ---
  function validateSameDayFlow(name, type, todayStr) {
    const queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    const history = JSON.parse(localStorage.getItem('submitted_attendance_logs') || '[]');
    const allRecords = [...queue, ...history];

    const todayRecords = allRecords.filter(r => 
      r.fullName.trim().toLowerCase() === name.trim().toLowerCase() && 
      r.time.startsWith(todayStr)
    );

    const hasCheckIn = todayRecords.some(r => r.type === 'Check-In');
    const hasCheckOut = todayRecords.some(r => r.type === 'Check-Out');

    if (type === 'Check-Out' && !hasCheckIn) {
      return { valid: false, msg: `Check-Out Blocked: ${name} has not checked in today (${todayStr}).` };
    }

    if (type === 'Check-In' && hasCheckIn) {
      return { valid: false, msg: `Check-In Blocked: ${name} has already checked in today (${todayStr}).` };
    }

    if (type === 'Check-Out' && hasCheckOut) {
      return { valid: false, msg: `Check-Out Blocked: ${name} has already checked out today (${todayStr}).` };
    }

    if (hasCheckIn && hasCheckOut) {
      return { valid: false, msg: `Attendance Complete: ${name} has completed both Check-In and Check-Out today (${todayStr}).` };
    }

    return { valid: true };
  }

  // --- FORM SUBMIT HANDLER ---
  document.getElementById('attendanceForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const desig = document.getElementById('designation').value;
    const name = document.getElementById('fullName').value;
    const type = document.querySelector('input[name="type"]:checked').value;
    const remarks = document.getElementById('remarks').value;

    if (!proj || !org || !dist || !uc || !desig || !name) {
      showPopup("Missing Fields", "All fields are required excluding remarks.", "error");
      return;
    }

    // Force GPS lock attempt if not acquired yet
    if (!capturedLocation) {
      await requestGPSCoordinates();
    }

    if (!capturedLocation) {
      showPopup("GPS Required", "Could not capture your GPS coordinates. Please enable Location/GPS on your device and tap 'Acquire GPS'.", "error");
      return;
    }

    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const todayStr = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    const timestamp = `${todayStr} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

    // Client-side same-day rules check
    const check = validateSameDayFlow(name, type, todayStr);
    if (!check.valid) {
      showPopup("Validation Error", check.msg, "error");
      return;
    }

    const record = {
      uid: 'UID-' + Date.now(),
      email: 'pwa-user@app.local',
      project: proj,
      organization: org,
      district: dist,
      unionCouncil: uc,
      designation: desig,
      fullName: name,
      type: type,
      time: timestamp,
      location: capturedLocation.formatted,
      remarks: remarks
    };

    if (navigator.onLine) {
      sendToServer(record);
    } else {
      saveLocally(record);
      showPopup("Saved Offline", "Record saved locally with GPS coordinates. It will auto-sync when online.", "success");
      resetForm();
    }
  });

  function sendToServer(record) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "Submitting...";

    fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'submitAttendance', record: record })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.textContent = "Submit Attendance";

      if (res.status === 'SUCCESS') {
        cacheSubmittedRecord(record);
        showPopup("Success", `${record.type} recorded for ${record.fullName} with GPS coordinates!`, "success");
        resetForm();
      } else if (res.status === 'VALIDATION_FAILED') {
        showPopup("Submission Denied", res.message, "error");
      } else {
        saveLocally(record);
        showPopup("Offline Saved", "Saved to local offline queue.", "success");
        resetForm();
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "Submit Attendance";
      saveLocally(record);
      showPopup("Saved Offline", "Network error. Saved to local offline queue.", "success");
      resetForm();
    });
  }

  function saveLocally(record) {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    queue.push(record);
    localStorage.setItem('offline_attendance_queue', JSON.stringify(queue));
    cacheSubmittedRecord(record);
    updateQueueBadge();
  }

  function cacheSubmittedRecord(record) {
    let logs = JSON.parse(localStorage.getItem('submitted_attendance_logs') || '[]');
    logs.push(record);
    localStorage.setItem('submitted_attendance_logs', JSON.stringify(logs));
  }

  function syncOfflineQueue() {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    if (queue.length === 0) return;

    let completed = 0;
    queue.forEach(record => {
      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'submitAttendance', record: record })
      })
      .then(() => {
        completed++;
        if (completed === queue.length) {
          localStorage.setItem('offline_attendance_queue', JSON.stringify([]));
          updateQueueBadge();
          showPopup("Synced", "All offline attendance records synced to Google Sheets!", "success");
        }
      });
    });
  }

  function resetForm() {
    document.getElementById('attendanceForm').reset();
    document.getElementById('typeIn').checked = true;
    initProjectDropdown();
  }

  // --- POPUP DIALOG CONTROLS ---
  function showPopup(title, message, type = "error") {
    const modal = document.getElementById('popupModal');
    const card = document.getElementById('popupCard');
    const icon = document.getElementById('popupIcon');

    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupMessage').textContent = message;

    if (type === "success") {
      modal.className = "popup-backdrop popup-success active";
      icon.textContent = "✓";
    } else {
      modal.className = "popup-backdrop popup-error active";
      icon.textContent = "!";
    }

    card.focus();
  }

  function closePopup() {
    const modal = document.getElementById('popupModal');
    modal.classList.remove('active');
  }
</script>
</body>
</html>
