<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance & Leave Portal</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <style>
    :root {
      --bg-surface: #f4f6f9;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border-subtle: #e2e8f0;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      padding: 24px 12px;
      min-height: 100vh;
    }

    .portal-wrapper {
      max-width: 460px;
      margin: 0 auto;
    }

    .portal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 28px 24px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin: 0;
    }
    .brand-header p {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 6px 12px;
      background: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
    }

    .badge-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge-online { background: #dcfce7; color: #15803d; }
    .badge-offline { background: #fef3c7; color: #b45309; }
    .badge-queue { background: #f1f5f9; color: #475569; }
    .badge-queue.active { background: #dbeafe; color: #1e40af; }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: block;
    }

    .form-control, .form-select {
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      font-size: 0.9rem;
      color: var(--text-primary);
      background-color: #ffffff;
      transition: all 0.15s ease-in-out;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .form-control:disabled, .form-select:disabled {
      background-color: #f8fafc;
      color: #64748b;
      cursor: not-allowed;
    }

    .segmented-picker {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: #f1f5f9;
      padding: 4px;
      border-radius: var(--radius-md);
      gap: 4px;
    }
    .segmented-picker input[type="radio"] { display: none; }
    .segmented-picker label {
      text-align: center;
      padding: 9px 6px;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }
    .segmented-picker input[type="radio"]:checked + label {
      background: #ffffff;
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }
    .segmented-picker input[id="typeLeave"]:checked + label {
      color: #d97706;
    }

    .leave-container {
      background: #fffbeb;
      border: 1px solid #fef3c7;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 18px;
      display: none;
    }

    .map-box {
      height: 130px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      margin-top: 8px;
      overflow: hidden;
    }

    .gps-btn {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: background 0.15s;
    }
    .gps-btn:hover { background: #f8fafc; color: var(--accent); }

    .btn-submit {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      width: 100%;
      transition: background 0.2s ease;
    }
    .btn-submit:hover { background-color: var(--accent-hover); }

    /* POPUP NOTIFICATION MODAL */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      padding: 20px;
    }
    .popup-overlay.active { opacity: 1; visibility: visible; }
    .popup-box {
      background: #ffffff;
      border-radius: var(--radius-lg);
      max-width: 360px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .popup-icon {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: bold;
      margin: 0 auto 12px auto;
    }
    .popup-error .popup-icon { background: #fee2e2; color: #dc2626; }
    .popup-warning .popup-icon { background: #fef3c7; color: #b45309; }
    .popup-success .popup-icon { background: #dcfce7; color: #166534; }
    .popup-action-btn {
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      width: 100%;
      margin-top: 16px;
    }
    .popup-error .popup-action-btn { background: #dc2626; color: white; }
    .popup-warning .popup-action-btn { background: #b45309; color: white; }
    .popup-success .popup-action-btn { background: #166534; color: white; }
  </style>
</head>
<body>

<div class="portal-wrapper">
  
  <div class="status-strip">
    <span id="networkBadge" class="badge-pill badge-online">● Online</span>
    <span id="queueBadge" class="badge-pill badge-queue">Sync Queue: 0</span>
  </div>

  <div class="portal-card">
    
    <div class="brand-header">
      <h1>Attendance & Leave Portal</h1>
      <p>Automated Verification Engine</p>
    </div>

    <form id="attendanceForm">
      
      <!-- EMAIL (EDITABLE FIELD) -->
      <div class="form-group">
        <label class="form-label">Email <span class="text-danger">*</span></label>
        <input type="email" id="userEmail" class="form-control" placeholder="name@organization.com" required onchange="localStorage.setItem('saved_user_email', this.value)">
      </div>

      <!-- ROSTER DROPDOWNS -->
      <div class="form-group">
        <label class="form-label">Project <span class="text-danger">*</span></label>
        <select id="project" class="form-select" onchange="onProjectChange()" required>
          <option value="">-- Loading Projects --</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Organization <span class="text-danger">*</span></label>
        <select id="organization" class="form-select" onchange="onOrganizationChange()" required disabled>
          <option value="">-- Select Project First --</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">District <span class="text-danger">*</span></label>
        <select id="district" class="form-select" onchange="onDistrictChange()" required disabled>
          <option value="">-- Select Organization First --</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Union Council <span class="text-danger">*</span></label>
        <select id="unionCouncil" class="form-select" onchange="onUnionCouncilChange()" required disabled>
          <option value="">-- Select District First --</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Full Name <span class="text-danger">*</span></label>
        <select id="fullName" class="form-select" onchange="onFullNameChange()" required disabled>
          <option value="">-- Select Union Council First --</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Designation <span class="text-danger">*</span></label>
        <select id="designation" class="form-select" required disabled>
          <option value="">-- Select Full Name First --</option>
        </select>
      </div>

      <!-- ATTENDANCE TYPE SELECTOR -->
      <div class="form-group">
        <label class="form-label">Submission Type <span class="text-danger">*</span></label>
        <div class="segmented-picker">
          <input type="radio" name="type" id="typeIn" value="Check-In" checked onchange="toggleType()">
          <label for="typeIn">Check-In</label>
          
          <input type="radio" name="type" id="typeOut" value="Check-Out" onchange="toggleType()">
          <label for="typeOut">Check-Out</label>

          <input type="radio" name="type" id="typeLeave" value="Leave" onchange="toggleType()">
          <label for="typeLeave">Leave</label>
        </div>
      </div>

      <!-- LEAVE PANEL -->
      <div id="leaveContainer" class="leave-container">
        <div class="mb-3">
          <label class="form-label">Leave Category</label>
          <select id="leaveCategory" class="form-select">
            <option value="Casual Leave">Casual Leave</option>
            <option value="Annual Leave">Annual Leave</option>
            <option value="Sick / Medical Leave">Sick / Medical Leave</option>
            <option value="Maternity Leave">Maternity Leave</option>
            <option value="Paternity Leave">Paternity Leave</option>
            <option value="Compassionate Leave">Compassionate Leave</option>
            <option value="Unpaid Leave">Unpaid Leave</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label class="form-label">Select Date(s)</label>
          <input type="text" id="leaveDatesPicker" class="form-control" placeholder="Tap to select dates">
        </div>
      </div>

      <!-- TIME DISPLAY -->
      <div class="form-group" id="timeContainer">
        <label class="form-label">Timestamp</label>
        <input type="text" id="timeDisplay" class="form-control" readonly placeholder="Capturing time...">
      </div>

      <!-- GPS LOCATION (NUMERIC DIGITS ONLY: ##.######, ##.######) -->
      <div class="form-group">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label mb-0">GPS Location</label>
          <button type="button" class="gps-btn" onclick="fetchGPSLocation(true)">🔄 GPS</button>
        </div>
        <input type="text" id="locationDisplay" class="form-control" readonly placeholder="Acquiring GPS coordinates...">
        <div id="mapContainer" class="map-box"></div>
      </div>

      <!-- REMARKS -->
      <div class="form-group mb-4">
        <label class="form-label">Remarks <span class="text-muted fw-normal">(Optional)</span></label>
        <textarea id="remarks" class="form-control" rows="2" placeholder="Add optional notes..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Submit Entry</button>
    </form>
  </div>
</div>

<!-- POPUP MODAL -->
<div id="popupModal" class="popup-overlay popup-error">
  <div class="popup-box">
    <div id="popupIcon" class="popup-icon">!</div>
    <h6 id="popupTitle" class="fw-bold mb-2">Notice</h6>
    <p id="popupMessage" class="text-muted small mb-0"></p>
    <button type="button" class="popup-action-btn" onclick="closePopup()">Acknowledge</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyLEMc5wnhuEbJXp7hP5Pmxhs4kKRU5LZABFqyd4ZnqJaWjJaVqUJhnqMFZPhXGUhFO-g/exec";

  let masterRoster = [];
  let map = null, mapMarker = null;
  let datePickerInstance = null;

  window.addEventListener('load', () => {
    // REGISTER SERVICE WORKER FOR 100% OFFLINE LOADING
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Offline Engine Ready:', reg.scope))
        .catch(err => console.log('Offline Engine Failed:', err));
    }

    const savedEmail = localStorage.getItem('saved_user_email');
    if (savedEmail) document.getElementById('userEmail').value = savedEmail;

    pruneLocalCache();
    updateNetworkStatus();
    initClock();
    initLeafletMap();
    initDatePicker();
    fetchGPSLocation();
    loadRosterData();
    
    if (navigator.onLine) syncOfflineQueue();
  });

  window.addEventListener('online', () => { updateNetworkStatus(); syncOfflineQueue(); });
  window.addEventListener('offline', updateNetworkStatus);

  /* GPS LOCATION (RETURNS STRICTLY ##.######, ##.######) */
  function fetchGPSLocation(forceRefresh = false) {
    const locInput = document.getElementById('locationDisplay');
    locInput.value = "Acquiring GPS coordinates...";

    if (!navigator.onLine && !forceRefresh) {
      const cachedLoc = localStorage.getItem('cached_last_gps');
      if (cachedLoc) {
        locInput.value = cachedLoc;
        const parts = cachedLoc.split(',');
        if (parts.length === 2) updateMapMarker(parseFloat(parts[0]), parseFloat(parts[1]));
        return;
      }
    }

    if (!("geolocation" in navigator)) {
      locInput.value = "GPS Not Supported";
      return;
    }

    const geoOptions = {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: forceRefresh ? 0 : 5000
    };

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        const formattedLoc = `${lat}, ${lng}`;
        
        locInput.value = formattedLoc;

        localStorage.setItem('cached_last_gps', formattedLoc);
        updateMapMarker(parseFloat(lat), parseFloat(lng));
      },
      (err) => {
        const cachedLoc = localStorage.getItem('cached_last_gps');
        if (cachedLoc) {
          locInput.value = cachedLoc;
        } else {
          locInput.value = "GPS Access Denied";
        }
      },
      geoOptions
    );
  }

  function initLeafletMap() {
    map = L.map('mapContainer', { zoomControl: false }).setView([20.0, 0.0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  }

  function updateMapMarker(lat, lng) {
    if (!map) return;
    map.setView([lat, lng], 16);
    if (mapMarker) mapMarker.setLatLng([lat, lng]);
    else mapMarker = L.marker([lat, lng]).addTo(map);
  }

  /* LOCAL CACHE & VALIDATION RULES */
  function getTodayStr() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  }

  function getCurrentMonthYearStr() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  }

  function getLocalLogs() {
    return JSON.parse(localStorage.getItem('user_attendance_logs') || '[]');
  }

  function pruneLocalCache() {
    let logs = getLocalLogs();
    const todayStr = getTodayStr();
    const currentMY = getCurrentMonthYearStr();

    logs = logs.filter(r => {
      const isLeave = r.type && r.type.startsWith('Leave');
      if (isLeave) {
        const dateParts = r.time.split(' ')[0].split('/');
        return dateParts.length === 3 && `${dateParts[1]}/${dateParts[2]}` === currentMY;
      } else {
        return r.time.startsWith(todayStr);
      }
    });

    localStorage.setItem('user_attendance_logs', JSON.stringify(logs));
    return logs;
  }

  function saveLocalLog(record) {
    let logs = getLocalLogs();
    logs.push(record);
    localStorage.setItem('user_attendance_logs', JSON.stringify(logs));
    pruneLocalCache();
  }

  function validateLocally(record) {
    const todayStr = getTodayStr();
    const logs = pruneLocalCache().filter(r => r.fullName.toLowerCase() === record.fullName.toLowerCase());

    if (record.type === 'Leave') {
      const leaveDates = record.leaveDates || [];
      for (let targetDate of leaveDates) {
        const hasLeave = logs.some(r => r.time.startsWith(targetDate) && r.type.startsWith('Leave'));
        if (hasLeave) {
          return { valid: false, title: "Leave Conflict", message: `Leave record already exists for ${record.fullName} on ${targetDate}.` };
        }
      }
      return { valid: true };
    }

    const todayLogs = logs.filter(r => r.time.startsWith(todayStr));
    const hasLeaveToday = todayLogs.some(r => r.type.startsWith('Leave'));
    const hasCheckInToday = todayLogs.some(r => r.type === 'Check-In');
    const hasCheckOutToday = todayLogs.some(r => r.type === 'Check-Out');

    if (hasLeaveToday) {
      return { valid: false, title: "Submission Blocked", message: `${record.fullName} is registered on Leave for today (${todayStr}).` };
    }

    if (record.type === 'Check-In') {
      const now = new Date();
      if (now.getHours() > 9 || (now.getHours() === 9 && (now.getMinutes() > 0 || now.getSeconds() > 0))) {
        return { valid: false, title: "Check-In Window Closed", message: "Check-In time window closes strictly at 09:00 AM." };
      }
      if (hasCheckInToday) {
        return { valid: false, title: "Already Checked-In", message: `${record.fullName} has already checked in for today (${todayStr}).` };
      }
    }

    if (record.type === 'Check-Out') {
      if (!hasCheckInToday) {
        return { valid: false, title: "Check-Out Denied", message: `No Check-In record found for ${record.fullName} today (${todayStr}). You must Check-In first.` };
      }
      if (hasCheckOutToday) {
        return { valid: false, title: "Already Checked-Out", message: `${record.fullName} has already checked out for today (${todayStr}).` };
      }
    }

    return { valid: true };
  }

  /* FORM SUBMISSION */
  document.getElementById('attendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('userEmail').value.trim();
    const locVal = document.getElementById('locationDisplay').value;

    if (!email) {
      showPopup("Email Missing", "Please enter a valid email address.", "error");
      return;
    }

    if (!locVal || locVal.includes("Acquiring") || locVal.includes("Denied") || locVal.includes("Supported")) {
      showPopup("Location Error", "Please capture GPS coordinates before submitting.", "error");
      return;
    }

    const type = document.querySelector('input[name="type"]:checked').value;
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;
    const desig = document.getElementById('designation').value;
    const remarks = document.getElementById('remarks').value;
    const currentTimeFormatted = document.getElementById('timeDisplay').value;

    let record = {
      uid: 'UID-' + Date.now(),
      email: email,
      project: proj,
      organization: org,
      district: dist,
      unionCouncil: uc,
      fullName: name,
      designation: desig,
      type: type,
      time: currentTimeFormatted,
      submissionTime: currentTimeFormatted,
      location: locVal,
      remarks: remarks
    };

    if (type === 'Leave') {
      const selectedDatesStr = document.getElementById('leaveDatesPicker').value;
      if (!selectedDatesStr) {
        showPopup("Dates Required", "Please select leave date(s) on the calendar picker.", "warning");
        return;
      }
      const leaveDates = selectedDatesStr.split(', ').map(d => d.trim());
      record.leaveCategory = document.getElementById('leaveCategory').value;
      record.leaveDates = leaveDates;
      record.time = `${leaveDates[0]} 09:00:00`;
    }

    const localCheck = validateLocally(record);
    if (!localCheck.valid) {
      showPopup(localCheck.title, localCheck.message, "error");
      return;
    }

    if (type === 'Leave') {
      record.leaveDates.forEach(d => {
        saveLocalLog({ ...record, type: `Leave (${record.leaveCategory})`, time: `${d} 09:00:00` });
      });
    } else {
      saveLocalLog(record);
    }

    if (navigator.onLine && GAS_API_URL !== "YOUR_DEPLOYED_WEB_APP_URL_HERE") {
      sendToServerDirectly(record);
    } else {
      saveLocallyOffline(record);
      showPopup("Saved Offline", "No active connection. Entry queued locally and will sync automatically when online.", "warning");
      resetForm();
    }
  });

  function sendToServerDirectly(record) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "Submitting...";

    fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'submitAttendance', record: record })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.textContent = "Submit Entry";

      if (res.status === 'SUCCESS' || res.status === 'SUCCESS_LEAVE') {
        showPopup("Submitted Successfully", `Entry recorded for ${record.fullName}.`, "success");
        resetForm();
      } else {
        saveLocallyOffline(record);
        showPopup("Queued Offline", res.message || "Server issue encountered. Saved locally.", "warning");
        resetForm();
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "Submit Entry";
      saveLocallyOffline(record);
      showPopup("Saved Offline", "Connection timeout. Queued locally for background sync.", "warning");
      resetForm();
    });
  }

  function saveLocallyOffline(record) {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    queue.push(record);
    localStorage.setItem('offline_attendance_queue', JSON.stringify(queue));
    updateQueueBadge();
  }

  async function syncOfflineQueue() {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    if (queue.length === 0 || GAS_API_URL === "YOUR_DEPLOYED_WEB_APP_URL_HERE") return;

    let remainingQueue = [];
    let syncedCount = 0;

    for (const record of queue) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitAttendance', record: record })
        });
        const res = await response.json();
        if (res.status === 'SUCCESS' || res.status === 'SUCCESS_LEAVE') syncedCount++;
        else remainingQueue.push(record);
      } catch (err) {
        remainingQueue.push(record);
      }
    }

    localStorage.setItem('offline_attendance_queue', JSON.stringify(remainingQueue));
    updateQueueBadge();
    if (syncedCount > 0) showPopup("Sync Complete", `${syncedCount} queued record(s) synced to Google Sheets.`, "success");
  }

  function fetchServerMonthSummary(fullName) {
    if (!navigator.onLine || GAS_API_URL === "YOUR_DEPLOYED_WEB_APP_URL_HERE") return;

    const todayStr = getTodayStr();
    const currentMY = getCurrentMonthYearStr();

    fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'getUserMonthSummary',
        fullName: fullName,
        monthYear: currentMY
      })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'SUCCESS' && Array.isArray(res.records)) {
        let localLogs = getLocalLogs();

        const validServerRecords = res.records.filter(r => {
          const isLeave = r.type && r.type.startsWith('Leave');
          if (isLeave) return true;
          return r.time.startsWith(todayStr);
        });

        validServerRecords.forEach(serverRec => {
          const exists = localLogs.some(l => 
            l.fullName.toLowerCase() === serverRec.fullName.toLowerCase() && 
            l.time === serverRec.time && 
            l.type === serverRec.type
          );
          if (!exists) localLogs.push(serverRec);
        });

        localStorage.setItem('user_attendance_logs', JSON.stringify(localLogs));
        pruneLocalCache();
      }
    })
    .catch(() => {});
  }

  /* DROPDOWN & ROSTER CASCADE LOGIC */
  function loadRosterData() {
    const cached = localStorage.getItem('employee_roster_cache');
    if (cached) { masterRoster = JSON.parse(cached); initProjectDropdown(); }

    if (navigator.onLine && GAS_API_URL !== "YOUR_DEPLOYED_WEB_APP_URL_HERE") {
      fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getEmployees' }) })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'SUCCESS' && res.employees) {
          masterRoster = res.employees;
          localStorage.setItem('employee_roster_cache', JSON.stringify(masterRoster));
          initProjectDropdown();
        }
      }).catch(() => {});
    }
  }

  function initProjectDropdown() {
    const projects = [...new Set(masterRoster.map(e => e.project))].filter(Boolean);
    populateSelect('project', projects, '-- Select Project --');
  }

  function onProjectChange() {
    const proj = document.getElementById('project').value;
    const filtered = masterRoster.filter(e => e.project === proj);
    populateSelect('organization', [...new Set(filtered.map(e => e.organization))].filter(Boolean), '-- Select Organization --');
    document.getElementById('organization').disabled = false;
  }

  function onOrganizationChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org);
    populateSelect('district', [...new Set(filtered.map(e => e.district))].filter(Boolean), '-- Select District --');
    document.getElementById('district').disabled = false;
  }

  function onDistrictChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist);
    populateSelect('unionCouncil', [...new Set(filtered.map(e => e.unionCouncil))].filter(Boolean), '-- Select Union Council --');
    document.getElementById('unionCouncil').disabled = false;
  }

  function onUnionCouncilChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc);
    populateSelect('fullName', [...new Set(filtered.map(e => e.fullName))].filter(Boolean), '-- Select Full Name --');
    document.getElementById('fullName').disabled = false;
  }

  function onFullNameChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc && e.fullName === name);
    const desigs = [...new Set(filtered.map(e => e.designation))].filter(Boolean);
    
    populateSelect('designation', desigs, '-- Select Designation --');
    document.getElementById('designation').disabled = false;
    if (desigs.length === 1) document.getElementById('designation').value = desigs[0];

    fetchServerMonthSummary(name);
  }

  /* HELPERS & UI CONTROLS */
  function initDatePicker() {
    datePickerInstance = flatpickr("#leaveDatesPicker", {
      mode: "multiple", dateFormat: "d/m/Y", conjunction: ", ", minDate: "today"
    });
  }

  function toggleType() {
    const isLeave = document.getElementById('typeLeave').checked;
    document.getElementById('leaveContainer').style.display = isLeave ? 'block' : 'none';
    document.getElementById('timeContainer').style.display = isLeave ? 'none' : 'block';
  }

  function initClock() {
    setInterval(() => {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('timeDisplay').value = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }, 1000);
  }

  function updateNetworkStatus() {
    const statusEl = document.getElementById('networkBadge');
    statusEl.className = navigator.onLine ? "badge-pill badge-online" : "badge-pill badge-offline";
    statusEl.textContent = navigator.onLine ? "● Online" : "● Offline";
    updateQueueBadge();
  }

  function updateQueueBadge() {
    const queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    const badge = document.getElementById('queueBadge');
    badge.className = queue.length > 0 ? "badge-pill badge-queue active" : "badge-pill badge-queue";
    badge.textContent = `Sync Queue: ${queue.length}`;
  }

  function populateSelect(id, items, placeholder) {
    const el = document.getElementById(id);
    el.innerHTML = `<option value="">${placeholder}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
  }

  function resetForm() {
    const currentEmail = document.getElementById('userEmail').value;
    document.getElementById('attendanceForm').reset();
    document.getElementById('userEmail').value = currentEmail;
    document.getElementById('typeIn').checked = true;
    toggleType();
    if (datePickerInstance) datePickerInstance.clear();
    initProjectDropdown();
    fetchGPSLocation();
  }

  function showPopup(title, message, type = "error") {
    const modal = document.getElementById('popupModal');
    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupMessage').textContent = message;
    modal.className = `popup-overlay popup-${type} active`;
    document.getElementById('popupIcon').textContent = type === "success" ? "✓" : (type === "warning" ? "!" : "✕");
  }

  function closePopup() { document.getElementById('popupModal').classList.remove('active'); }
</script>
</body>
</html>
