<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Attendance & Leave Portal</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border-color: #e2e8f0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      padding-top: 16px;
      padding-bottom: 40px;
    }

    .app-container { max-width: 480px; margin: 0 auto; }

    .card-custom {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      padding: 24px 20px;
    }

    .status-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }

    .chip-badge {
      font-size: 0.78rem; font-weight: 600; padding: 5px 12px; border-radius: 20px;
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent;
    }
    .chip-online { background-color: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .chip-offline { background-color: #fffbeb; color: #92400e; border-color: #fef3c7; }
    .chip-sync { background-color: #f1f5f9; color: #334155; border-color: #e2e8f0; }
    .chip-sync.has-pending { background-color: #eff6ff; color: #1e40af; border-color: #bfdbfe; }

    .action-btn-group {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
    }

    .btn-action-tile {
      background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 14px;
      padding: 10px 12px; font-weight: 600; font-size: 0.82rem; color: #334155;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action-tile:hover { background: #f8fafc; border-color: var(--primary); color: var(--primary); }

    .form-label { font-weight: 600; font-size: 0.8rem; color: #334155; margin-bottom: 6px; }
    .form-select, .form-control {
      border-radius: 12px; border: 1.5px solid var(--border-color); padding: 11px 14px; font-size: 0.92rem;
    }

    .segmented-control {
      display: flex; background-color: #f1f5f9; padding: 4px; border-radius: 14px; border: 1px solid var(--border-color); gap: 4px;
    }
    .segmented-control input[type="radio"] { display: none; }
    .segmented-control label {
      flex: 1; text-align: center; padding: 10px 8px; font-weight: 600; font-size: 0.84rem;
      color: var(--text-muted); border-radius: 10px; cursor: pointer; margin: 0;
    }
    .segmented-control input[type="radio"]:checked + label {
      background-color: var(--primary); color: #ffffff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }
    .segmented-control input[id="typeLeave"]:checked + label {
      background-color: #eab308 !important; color: #0f172a !important;
    }

    .leave-panel {
      background-color: #fefce8; border: 1.5px solid #fef08a; border-radius: 14px; padding: 16px; margin-bottom: 16px; display: none;
    }

    #mapContainer { height: 140px; border-radius: 14px; border: 1.5px solid var(--border-color); margin-bottom: 1rem; }

    .btn-submit { background-color: var(--primary); border: none; border-radius: 12px; padding: 13px; font-weight: 600; font-size: 0.98rem; color: #ffffff; }

    .status-badge-pill {
      font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 12px; display: inline-block;
    }
    .pill-green { background: #dcfce7; color: #15803d; }
    .pill-orange { background: #ffedd5; color: #c2410c; }
    .pill-yellow { background: #fef9c3; color: #a16207; }
    .pill-red { background: #fee2e2; color: #b91c1c; }

    .popup-backdrop {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
      opacity: 0; visibility: hidden; transition: all 0.2s ease; padding: 20px;
    }
    .popup-backdrop.active { opacity: 1; visibility: visible; }
    .popup-card { background: #ffffff; border-radius: 20px; max-width: 380px; width: 100%; padding: 24px; text-align: center; }
    .popup-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; margin: 0 auto 14px auto; }
    .popup-error .popup-icon { background: #fee2e2; color: #dc2626; }
    .popup-warning .popup-icon { background: #fef3c7; color: #b45309; }
    .popup-success .popup-icon { background: #dcfce7; color: #166534; }
    .popup-btn { border: none; border-radius: 10px; padding: 10px 18px; font-weight: 600; width: 100%; margin-top: 16px; }
    .popup-error .popup-btn { background: #dc2626; color: white; }
    .popup-warning .popup-btn { background: #b45309; color: white; }
    .popup-success .popup-btn { background: #166534; color: white; }
  </style>
</head>
<body>

<div class="container app-container">

  <div class="status-bar">
    <span id="networkStatus" class="chip-badge chip-online">● Online</span>
    <span id="queueStatus" class="chip-badge chip-sync">Sync Queue: 0</span>
  </div>

  <div class="card-custom">
    <div class="text-center mb-3">
      <h5 class="fw-bold m-0">Attendance & Leave Portal</h5>
      <p class="text-muted small m-0 mt-1">Local Validation Engine</p>
    </div>

    <!-- Quick Action Buttons -->
    <div class="action-btn-group">
      <button type="button" class="btn-action-tile" onclick="openTodayStatusModal()">
        📅 Today's Status
      </button>
      <button type="button" class="btn-action-tile" onclick="openMonthlyLeavesModal()">
        🏖️ Monthly Leaves
      </button>
    </div>

    <form id="attendanceForm">
      
      <div class="mb-3">
        <label class="form-label">Official Email Address <span class="text-danger">*</span></label>
        <input type="email" id="userEmail" class="form-control" placeholder="name@organization.com" required onchange="localStorage.setItem('saved_user_email', this.value)">
      </div>

      <div class="mb-3">
        <label class="form-label">Project <span class="text-danger">*</span></label>
        <select id="project" class="form-select" onchange="onProjectChange()" required>
          <option value="">-- Loading Projects --</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Organization <span class="text-danger">*</span></label>
        <select id="organization" class="form-select" onchange="onOrganizationChange()" required disabled>
          <option value="">-- Select Project First --</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">District <span class="text-danger">*</span></label>
        <select id="district" class="form-select" onchange="onDistrictChange()" required disabled>
          <option value="">-- Select Organization First --</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Union Council <span class="text-danger">*</span></label>
        <select id="unionCouncil" class="form-select" onchange="onUnionCouncilChange()" required disabled>
          <option value="">-- Select District First --</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Full Name <span class="text-danger">*</span></label>
        <select id="fullName" class="form-select" onchange="onFullNameChange()" required disabled>
          <option value="">-- Select Union Council First --</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Designation <span class="text-danger">*</span></label>
        <select id="designation" class="form-select" required disabled>
          <option value="">-- Select Full Name First --</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Attendance Type <span class="text-danger">*</span></label>
        <div class="segmented-control">
          <input type="radio" name="type" id="typeIn" value="Check-In" checked onchange="toggleAttendanceType()">
          <label for="typeIn">Check-In</label>
          
          <input type="radio" name="type" id="typeOut" value="Check-Out" onchange="toggleAttendanceType()">
          <label for="typeOut">Check-Out</label>

          <input type="radio" name="type" id="typeLeave" value="Leave" onchange="toggleAttendanceType()">
          <label for="typeLeave">Leave</label>
        </div>
      </div>

      <!-- LEAVE PANEL -->
      <div id="leavePanel" class="leave-panel">
        <div class="mb-3">
          <label class="form-label">Leave Category <span class="text-danger">*</span></label>
          <select id="leaveCategory" class="form-select">
            <option value="Casual Leave">Casual Leave</option>
            <option value="Annual Leave">Annual Leave</option>
            <option value="Sick / Medical Leave">Sick / Medical Leave</option>
            <option value="Maternity Leave">Maternity Leave</option>
            <option value="Paternity Leave">Paternity Leave</option>
            <option value="Compassionate / Bereavement Leave">Compassionate / Bereavement Leave</option>
            <option value="Unpaid / Without Pay Leave">Unpaid / Without Pay Leave</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="mb-0">
          <label class="form-label">Select Leave Date(s) <span class="text-danger">*</span></label>
          <input type="text" id="leaveDatesPicker" class="form-control" placeholder="Tap to select dates">
        </div>
      </div>

      <div class="mb-3" id="timeFieldContainer">
        <label class="form-label">Current Date & Time</label>
        <input type="text" id="timeDisplay" class="form-control" readonly placeholder="Capturing time...">
      </div>

      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label m-0">Location</label>
          <button type="button" class="btn-refresh-icon" style="background:#f1f5f9; border:1px solid #e2e8f0; border-radius:8px; padding:2px 8px;" onclick="fetchGPSLocation()">🔄</button>
        </div>
        <input type="text" id="locationDisplay" class="form-control" readonly placeholder="Acquiring GPS coordinates...">
      </div>

      <div id="mapContainer"></div>

      <div class="mb-4">
        <label class="form-label">Remarks <span class="text-muted fw-normal">(Optional)</span></label>
        <textarea id="remarks" class="form-control" rows="2" placeholder="Write any optional notes..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-submit w-100">Submit Request</button>
    </form>
  </div>
</div>

<!-- TODAY STATUS MODAL -->
<div class="modal fade" id="todayStatusModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-bold">📅 Today's Attendance & Leave Status</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="todayStatusContent">
          <p class="text-muted small text-center mb-0">Please select Full Name first to view status.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-secondary w-100" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- MONTHLY LEAVES MODAL -->
<div class="modal fade" id="monthlyLeavesModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-bold">🏖️ Applied Leaves (Current Month)</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="monthlyLeavesContent">
          <p class="text-muted small text-center mb-0">Please select Full Name first to view monthly leaves.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-secondary w-100" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- ALERT POPUP -->
<div id="popupModal" class="popup-backdrop popup-error">
  <div class="popup-card">
    <div id="popupIcon" class="popup-icon">!</div>
    <h6 id="popupTitle" class="fw-bold mb-2">Notice</h6>
    <p id="popupMessage" class="text-muted small mb-0"></p>
    <button type="button" class="popup-btn" onclick="closePopup()">Acknowledge</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyLEMc5wnhuEbJXp7hP5Pmxhs4kKRU5LZABFqyd4ZnqJaWjJaVqUJhnqMFZPhXGUhFO-g/exec";

  let masterRoster = [];
  let map = null, mapMarker = null;
  let datePickerInstance = null;

  window.addEventListener('load', () => {
    const savedEmail = localStorage.getItem('saved_user_email');
    if (savedEmail) document.getElementById('userEmail').value = savedEmail;

    pruneLocalCache(); // Purge outdated daily check-in/out logs on load
    updateNetworkStatus();
    initClock();
    initLeafletMap();
    initDatePicker();
    fetchGPSLocation();
    loadRosterData();
    
    if (navigator.onLine) syncOfflineQueue();
  });

  window.addEventListener('online', () => { updateNetworkStatus(); syncOfflineQueue(); });
  window.addEventListener('offline', updateNetworkStatus);

  function getTodayStr() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  }

  function getCurrentMonthYearStr() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  }

  /* LOCAL CACHE & RETENTION MANAGEMENT */
  function getLocalLogs() {
    return JSON.parse(localStorage.getItem('user_attendance_logs') || '[]');
  }

  // ENFORCED RETENTION RULE:
  // - Check-In / Check-Out: Saved ONLY for current date
  // - Leave: Saved for complete current month
  function pruneLocalCache() {
    let logs = getLocalLogs();
    const todayStr = getTodayStr();
    const currentMY = getCurrentMonthYearStr();

    logs = logs.filter(r => {
      const isLeave = r.type && r.type.startsWith('Leave');
      if (isLeave) {
        const dateParts = r.time.split(' ')[0].split('/');
        return dateParts.length === 3 && `${dateParts[1]}/${dateParts[2]}` === currentMY;
      } else {
        return r.time.startsWith(todayStr); // Only keep Check-In/Check-Out for today
      }
    });

    localStorage.setItem('user_attendance_logs', JSON.stringify(logs));
    return logs;
  }

  function saveLocalLog(record) {
    let logs = getLocalLogs();
    logs.push(record);
    localStorage.setItem('user_attendance_logs', JSON.stringify(logs));
    pruneLocalCache();
  }

  function fetchServerMonthSummary(fullName) {
    if (!navigator.onLine || GAS_API_URL.includes("YOUR_DEPLOYED")) return;

    const todayStr = getTodayStr();
    const currentMY = getCurrentMonthYearStr();

    fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'getUserMonthSummary',
        fullName: fullName,
        monthYear: currentMY
      })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'SUCCESS' && Array.isArray(res.records)) {
        let localLogs = getLocalLogs();

        // Filter incoming server records: Check-In/Out ONLY for today; Leaves for current month
        const validServerRecords = res.records.filter(r => {
          const isLeave = r.type && r.type.startsWith('Leave');
          if (isLeave) return true;
          return r.time.startsWith(todayStr);
        });

        validServerRecords.forEach(serverRec => {
          const exists = localLogs.some(l => 
            l.fullName.toLowerCase() === serverRec.fullName.toLowerCase() && 
            l.time === serverRec.time && 
            l.type === serverRec.type
          );
          if (!exists) localLogs.push(serverRec);
        });

        localStorage.setItem('user_attendance_logs', JSON.stringify(localLogs));
        pruneLocalCache();
      }
    })
    .catch(() => {});
  }

  /* MODAL DISPLAY LOGIC */
  function openTodayStatusModal() {
    const fullName = document.getElementById('fullName').value;
    const contentEl = document.getElementById('todayStatusContent');
    
    if (!fullName) {
      contentEl.innerHTML = `<p class="text-danger small text-center mb-0">Please select an Employee Full Name first.</p>`;
      new bootstrap.Modal(document.getElementById('todayStatusModal')).show();
      return;
    }

    const todayStr = getTodayStr();
    const logs = pruneLocalCache().filter(r => r.fullName.toLowerCase() === fullName.toLowerCase() && r.time.startsWith(todayStr));

    const checkInRecord = logs.find(r => r.type === 'Check-In');
    const checkOutRecord = logs.find(r => r.type === 'Check-Out');
    const leaveRecord = logs.find(r => r.type.startsWith('Leave'));

    let html = `<div class="p-2">
      <div class="fw-bold mb-2 text-center text-primary">${fullName}</div>
      <div class="small text-muted text-center mb-3">Date: ${todayStr}</div>
      
      <div class="list-group list-group-flush border-top border-bottom">
        <div class="list-group-item d-flex justify-content-between align-items-center px-0">
          <span>Check-In Status</span>
          ${checkInRecord 
            ? `<span class="status-badge-pill pill-green">Checked-In (${checkInRecord.time.split(' ')[1]})</span>`
            : `<span class="status-badge-pill pill-red">Not Checked-In</span>`}
        </div>
        
        <div class="list-group-item d-flex justify-content-between align-items-center px-0">
          <span>Check-Out Status</span>
          ${checkOutRecord 
            ? `<span class="status-badge-pill pill-green">Checked-Out (${checkOutRecord.time.split(' ')[1]})</span>`
            : `<span class="status-badge-pill pill-orange">Not Checked-Out</span>`}
        </div>

        <div class="list-group-item d-flex justify-content-between align-items-center px-0">
          <span>Leave Applied Today</span>
          ${leaveRecord 
            ? `<span class="status-badge-pill pill-yellow">${leaveRecord.type}</span>`
            : `<span class="status-badge-pill pill-green">No Leave Today</span>`}
        </div>
      </div>
    </div>`;

    contentEl.innerHTML = html;
    new bootstrap.Modal(document.getElementById('todayStatusModal')).show();
  }

  function openMonthlyLeavesModal() {
    const fullName = document.getElementById('fullName').value;
    const contentEl = document.getElementById('monthlyLeavesContent');

    if (!fullName) {
      contentEl.innerHTML = `<p class="text-danger small text-center mb-0">Please select an Employee Full Name first.</p>`;
      new bootstrap.Modal(document.getElementById('monthlyLeavesModal')).show();
      return;
    }

    const currentMY = getCurrentMonthYearStr();
    const logs = pruneLocalCache().filter(r => {
      if (r.fullName.toLowerCase() !== fullName.toLowerCase() || !r.type.startsWith('Leave')) return false;
      const parts = r.time.split(' ')[0].split('/');
      return parts.length === 3 && `${parts[1]}/${parts[2]}` === currentMY;
    });

    if (logs.length === 0) {
      contentEl.innerHTML = `<div class="text-center p-3">
        <span class="fs-4">🏖️</span>
        <p class="text-muted small mt-2 mb-0">No leave records found for ${fullName} in current month (${currentMY}).</p>
      </div>`;
    } else {
      let rowsHtml = logs.map(l => `
        <div class="p-2 mb-2 bg-light rounded border d-flex justify-content-between align-items-center">
          <div>
            <div class="fw-bold small">${l.time.split(' ')[0]}</div>
            <div class="text-muted" style="font-size: 0.75rem;">${l.type}</div>
          </div>
          <span class="status-badge-pill pill-yellow">Applied</span>
        </div>
      `).join('');

      contentEl.innerHTML = `<div class="small fw-bold mb-2 text-center text-primary">${fullName} (${logs.length} Leave(s))</div>` + rowsHtml;
    }

    new bootstrap.Modal(document.getElementById('monthlyLeavesModal')).show();
  }

  /* PRE-SUBMISSION LOCAL VALIDATION RULES */
  function validateLocally(record) {
    const todayStr = getTodayStr();
    const logs = pruneLocalCache().filter(r => r.fullName.toLowerCase() === record.fullName.toLowerCase());

    // 1. Leave Check (Full Month Scope)
    if (record.type === 'Leave') {
      const leaveDates = record.leaveDates || [];
      for (let targetDate of leaveDates) {
        const hasLeave = logs.some(r => r.time.startsWith(targetDate) && r.type.startsWith('Leave'));
        if (hasLeave) {
          return { valid: false, title: "Leave Already Submitted", message: `Leave record already exists for ${record.fullName} on ${targetDate}.` };
        }
      }
      return { valid: true };
    }

    // 2. Attendance Check (Current Date Scope)
    const todayLogs = logs.filter(r => r.time.startsWith(todayStr));
    const hasLeaveToday = todayLogs.some(r => r.type.startsWith('Leave'));
    const hasCheckInToday = todayLogs.some(r => r.type === 'Check-In');
    const hasCheckOutToday = todayLogs.some(r => r.type === 'Check-Out');

    if (hasLeaveToday) {
      return { valid: false, title: "Submission Blocked", message: `${record.fullName} is registered on Leave for today (${todayStr}).` };
    }

    if (record.type === 'Check-In') {
      const now = new Date();
      if (now.getHours() > 9 || (now.getHours() === 9 && (now.getMinutes() > 0 || now.getSeconds() > 0))) {
        return { valid: false, title: "Check-In Denied", message: "Check-In time window closes strictly at 9:00 AM." };
      }
      if (hasCheckInToday) {
        return { valid: false, title: "Check-In Denied", message: `${record.fullName} has already checked in today (${todayStr}).` };
      }
    }

    if (record.type === 'Check-Out') {
      if (!hasCheckInToday) {
        return { valid: false, title: "Check-Out Denied", message: `${record.fullName} has no Check-In record for today (${todayStr}). You must Check-In first.` };
      }
      if (hasCheckOutToday) {
        return { valid: false, title: "Check-Out Denied", message: `${record.fullName} has already checked out today (${todayStr}).` };
      }
    }

    return { valid: true };
  }

  /* FORM SUBMIT HANDLER */
  document.getElementById('attendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('userEmail').value.trim();
    const locVal = document.getElementById('locationDisplay').value;

    if (!email || !locVal || locVal.includes("Acquiring") || locVal.includes("Denied")) {
      showPopup("Form Incomplete", "Please provide a valid email and GPS location.", "error");
      return;
    }

    const type = document.querySelector('input[name="type"]:checked').value;
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;
    const desig = document.getElementById('designation').value;
    const remarks = document.getElementById('remarks').value;
    const currentTimeFormatted = document.getElementById('timeDisplay').value;

    let record = {
      uid: 'UID-' + Date.now(),
      email: email,
      project: proj,
      organization: org,
      district: dist,
      unionCouncil: uc,
      fullName: name,
      designation: desig,
      type: type,
      time: currentTimeFormatted,
      submissionTime: currentTimeFormatted,
      location: locVal,
      remarks: remarks
    };

    if (type === 'Leave') {
      const selectedDatesStr = document.getElementById('leaveDatesPicker').value;
      if (!selectedDatesStr) {
        showPopup("Missing Dates", "Please select at least one leave date on the calendar.", "warning");
        return;
      }
      const leaveDates = selectedDatesStr.split(', ').map(d => d.trim());
      record.leaveCategory = document.getElementById('leaveCategory').value;
      record.leaveDates = leaveDates;
      record.time = `${leaveDates[0]} 09:00:00`;
    }

    // RUN LOCAL VALIDATION RULES FIRST
    const localCheck = validateLocally(record);
    if (!localCheck.valid) {
      showPopup(localCheck.title, localCheck.message, "error");
      return;
    }

    // UPDATE LOCAL STATE IMMEDIATELY FOR INSTANT FEEDBACK
    if (type === 'Leave') {
      record.leaveDates.forEach(d => {
        saveLocalLog({ ...record, type: `Leave (${record.leaveCategory})`, time: `${d} 09:00:00` });
      });
    } else {
      saveLocalLog(record);
    }

    if (navigator.onLine) {
      sendToServerDirectly(record);
    } else {
      saveLocallyOffline(record);
      showPopup("Saved Offline", "No internet connection detected. Record queued locally and will sync when online.", "warning");
      resetForm();
    }
  });

  function sendToServerDirectly(record) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "Submitting...";

    fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'submitAttendance', record: record })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.textContent = "Submit Request";

      if (res.status === 'SUCCESS' || res.status === 'SUCCESS_LEAVE') {
        showPopup("Success", `Record saved successfully for ${record.fullName}!`, "success");
        resetForm();
      } else {
        saveLocallyOffline(record);
        showPopup("Queued Offline", res.message || "Server warning received. Queued locally for retry.", "warning");
        resetForm();
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "Submit Request";
      saveLocallyOffline(record);
      showPopup("Saved Offline", "Connection interrupted. Queued locally and will sync when online.", "warning");
      resetForm();
    });
  }

  function saveLocallyOffline(record) {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    queue.push(record);
    localStorage.setItem('offline_attendance_queue', JSON.stringify(queue));
    updateQueueBadge();
  }

  async function syncOfflineQueue() {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    if (queue.length === 0) return;

    let remainingQueue = [];
    let syncedCount = 0;

    for (const record of queue) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitAttendance', record: record })
        });
        const res = await response.json();
        if (res.status === 'SUCCESS' || res.status === 'SUCCESS_LEAVE') syncedCount++;
        else remainingQueue.push(record);
      } catch (err) {
        remainingQueue.push(record);
      }
    }

    localStorage.setItem('offline_attendance_queue', JSON.stringify(remainingQueue));
    updateQueueBadge();
    if (syncedCount > 0) showPopup("Auto Sync Complete", `${syncedCount} offline record(s) synced to Google Sheets.`, "success");
  }

  function onFullNameChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc && e.fullName === name);
    const desigs = [...new Set(filtered.map(e => e.designation))].filter(Boolean);
    
    populateSelect('designation', desigs, '-- Select Designation --');
    document.getElementById('designation').disabled = false;
    if (desigs.length === 1) document.getElementById('designation').value = desigs[0];

    // Fetch user records from server and filter locally according to retention rules
    fetchServerMonthSummary(name);
  }

  /* UTILITY & UI FUNCTIONS */
  function initDatePicker() {
    datePickerInstance = flatpickr("#leaveDatesPicker", {
      mode: "multiple", dateFormat: "d/m/Y", conjunction: ", ", minDate: "today"
    });
  }

  function toggleAttendanceType() {
    const isLeave = document.getElementById('typeLeave').checked;
    document.getElementById('leavePanel').style.display = isLeave ? 'block' : 'none';
    document.getElementById('timeFieldContainer').style.display = isLeave ? 'none' : 'block';
  }

  function initClock() {
    setInterval(() => {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('timeDisplay').value = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }, 1000);
  }

  function initLeafletMap() {
    map = L.map('mapContainer').setView([20.0, 0.0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  }

  function fetchGPSLocation() {
    const locInput = document.getElementById('locationDisplay');
    locInput.value = "Acquiring GPS coordinates...";
    if (!("geolocation" in navigator)) { locInput.value = "GPS Not Supported"; return; }

    navigator.geolocation.getCurrentPosition((pos) => {
      const lat = pos.coords.latitude.toFixed(6), lng = pos.coords.longitude.toFixed(6);
      locInput.value = `${lat}, ${lng}`;
      map.setView([lat, lng], 16);
      if (mapMarker) mapMarker.setLatLng([lat, lng]);
      else mapMarker = L.marker([lat, lng]).addTo(map);
    }, () => { locInput.value = "GPS Access Denied"; }, { enableHighAccuracy: true });
  }

  function updateNetworkStatus() {
    const statusEl = document.getElementById('networkStatus');
    statusEl.className = navigator.onLine ? "chip-badge chip-online" : "chip-badge chip-offline";
    statusEl.textContent = navigator.onLine ? "● Online" : "● Offline";
    updateQueueBadge();
  }

  function updateQueueBadge() {
    const queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    const badge = document.getElementById('queueStatus');
    badge.className = queue.length > 0 ? "chip-badge chip-sync has-pending" : "chip-badge chip-sync";
    badge.textContent = `Sync Queue: ${queue.length}`;
  }

  function loadRosterData() {
    const cached = localStorage.getItem('employee_roster_cache');
    if (cached) { masterRoster = JSON.parse(cached); initProjectDropdown(); }

    if (navigator.onLine && GAS_API_URL !== "YOUR_DEPLOYED_WEB_APP_URL_HERE") {
      fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getEmployees' }) })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'SUCCESS' && res.employees) {
          masterRoster = res.employees;
          localStorage.setItem('employee_roster_cache', JSON.stringify(masterRoster));
          initProjectDropdown();
        }
      }).catch(() => {});
    }
  }

  function initProjectDropdown() {
    const projects = [...new Set(masterRoster.map(e => e.project))].filter(Boolean);
    populateSelect('project', projects, '-- Select Project --');
  }

  function onProjectChange() {
    const proj = document.getElementById('project').value;
    const filtered = masterRoster.filter(e => e.project === proj);
    populateSelect('organization', [...new Set(filtered.map(e => e.organization))].filter(Boolean), '-- Select Organization --');
    document.getElementById('organization').disabled = false;
  }

  function onOrganizationChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org);
    populateSelect('district', [...new Set(filtered.map(e => e.district))].filter(Boolean), '-- Select District --');
    document.getElementById('district').disabled = false;
  }

  function onDistrictChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist);
    populateSelect('unionCouncil', [...new Set(filtered.map(e => e.unionCouncil))].filter(Boolean), '-- Select Union Council --');
    document.getElementById('unionCouncil').disabled = false;
  }

  function onUnionCouncilChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc);
    populateSelect('fullName', [...new Set(filtered.map(e => e.fullName))].filter(Boolean), '-- Select Full Name --');
    document.getElementById('fullName').disabled = false;
  }

  function populateSelect(id, items, placeholder) {
    const el = document.getElementById(id);
    el.innerHTML = `<option value="">${placeholder}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
  }

  function resetForm() {
    const savedEmail = document.getElementById('userEmail').value;
    document.getElementById('attendanceForm').reset();
    document.getElementById('userEmail').value = savedEmail;
    document.getElementById('typeIn').checked = true;
    toggleAttendanceType();
    if (datePickerInstance) datePickerInstance.clear();
    initProjectDropdown();
    fetchGPSLocation();
  }

  function showPopup(title, message, type = "error") {
    const modal = document.getElementById('popupModal');
    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupMessage').textContent = message;
    modal.className = `popup-backdrop popup-${type} active`;
    document.getElementById('popupIcon').textContent = type === "success" ? "✓" : (type === "warning" ? "!" : "✕");
  }

  function closePopup() { document.getElementById('popupModal').classList.remove('active'); }
</script>
</body>
</html>
