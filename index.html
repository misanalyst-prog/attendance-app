<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Portal</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #e2e8f0;
      --readonly-bg: #f8fafc;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      padding-top: 16px;
      padding-bottom: 40px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Minimalist Card */
    .card-custom {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      padding: 24px 20px;
    }

    /* Top Status & Pending Chip */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .chip-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
    }

    .chip-online { background-color: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .chip-offline { background-color: #fffbeb; color: #92400e; border-color: #fef3c7; }
    
    .chip-sync {
      background-color: #f1f5f9;
      color: #334155;
      border-color: #e2e8f0;
    }

    .chip-sync.has-pending {
      background-color: #eff6ff;
      color: #1e40af;
      border-color: #bfdbfe;
    }

    /* Form Controls */
    .form-label {
      font-weight: 600;
      font-size: 0.8rem;
      color: #334155;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .form-select, .form-control {
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      padding: 11px 14px;
      font-size: 0.92rem;
      color: var(--text-main);
      background-color: #ffffff;
      transition: all 0.2s ease;
    }

    .form-select:focus, .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .form-control[readonly] {
      background-color: var(--readonly-bg);
      color: #475569;
      font-weight: 500;
      cursor: not-allowed;
    }

    .form-select:disabled {
      background-color: var(--readonly-bg);
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Segmented Control for Check-In / Check-Out */
    .segmented-control {
      display: flex;
      background-color: #f1f5f9;
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    .segmented-control input[type="radio"] {
      display: none;
    }

    .segmented-control label {
      flex: 1;
      text-align: center;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }

    .segmented-control input[type="radio"]:checked + label {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    /* Icon Refresh Button */
    .btn-refresh-icon {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      color: #475569;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
    }

    .btn-refresh-icon:hover {
      background: #e2e8f0;
      color: var(--primary);
    }

    .btn-refresh-icon svg {
      width: 14px;
      height: 14px;
      transition: transform 0.4s ease;
    }

    .btn-refresh-icon:active svg {
      transform: rotate(180deg);
    }

    /* Map Styling */
    #mapContainer {
      height: 170px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      margin-bottom: 1rem;
      overflow: hidden;
      z-index: 1;
    }

    /* Submit Button */
    .btn-submit {
      background-color: var(--primary);
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-weight: 600;
      font-size: 0.98rem;
      color: #ffffff;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    /* Modern Modal */
    .popup-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      opacity: 0; visibility: hidden;
      transition: all 0.2s ease;
      padding: 20px;
    }

    .popup-backdrop.active { opacity: 1; visibility: visible; }

    .popup-card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 380px; width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
    }

    .popup-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
      margin: 0 auto 14px auto;
    }

    .popup-error .popup-icon { background: #fee2e2; color: #dc2626; }
    .popup-success .popup-icon { background: #dcfce7; color: #166534; }

    .popup-btn {
      border: none; border-radius: 10px;
      padding: 10px 18px; font-weight: 600;
      width: 100%; margin-top: 16px;
    }

    .popup-error .popup-btn { background: #dc2626; color: white; }
    .popup-success .popup-btn { background: #166534; color: white; }
  </style>
</head>
<body>

<div class="container app-container">

  <!-- Top Status & Pending Sync Chip Header -->
  <div class="status-bar">
    <span id="networkStatus" class="chip-badge chip-online">● Online</span>
    <span id="queueStatus" class="chip-badge chip-sync">Sync Queue: 0</span>
  </div>

  <div class="card-custom">
    <div class="text-center mb-4">
      <h5 class="fw-bold m-0" style="color: var(--text-main);">Attendance Portal</h5>
      <p class="text-muted small m-0 mt-1">Automatic GPS Location & Time Tracking</p>
    </div>

    <form id="attendanceForm">
      
      <!-- 1. Project -->
      <div class="mb-3">
        <label class="form-label">Project <span class="text-danger">*</span></label>
        <select id="project" class="form-select" onchange="onProjectChange()" required>
          <option value="">-- Select Project --</option>
        </select>
      </div>

      <!-- 2. Organization -->
      <div class="mb-3">
        <label class="form-label">Organization <span class="text-danger">*</span></label>
        <select id="organization" class="form-select" onchange="onOrganizationChange()" required disabled>
          <option value="">-- Select Project First --</option>
        </select>
      </div>

      <!-- 3. District -->
      <div class="mb-3">
        <label class="form-label">District <span class="text-danger">*</span></label>
        <select id="district" class="form-select" onchange="onDistrictChange()" required disabled>
          <option value="">-- Select Organization First --</option>
        </select>
      </div>

      <!-- 4. Union Council -->
      <div class="mb-3">
        <label class="form-label">Union Council <span class="text-danger">*</span></label>
        <select id="unionCouncil" class="form-select" onchange="onUnionCouncilChange()" required disabled>
          <option value="">-- Select District First --</option>
        </select>
      </div>

      <!-- 5. Full Name (Positioned above Designation) -->
      <div class="mb-3">
        <label class="form-label">Full Name <span class="text-danger">*</span></label>
        <select id="fullName" class="form-select" onchange="onFullNameChange()" required disabled>
          <option value="">-- Select Union Council First --</option>
        </select>
      </div>

      <!-- 6. Designation (Positioned below Full Name) -->
      <div class="mb-3">
        <label class="form-label">Designation <span class="text-danger">*</span></label>
        <select id="designation" class="form-select" required disabled>
          <option value="">-- Select Full Name First --</option>
        </select>
      </div>

      <!-- 7. Attendance Type -->
      <div class="mb-3">
        <label class="form-label d-block">Attendance Type <span class="text-danger">*</span></label>
        <div class="segmented-control">
          <input type="radio" name="type" id="typeIn" value="Check-In" checked>
          <label for="typeIn">Check-In</label>
          
          <input type="radio" name="type" id="typeOut" value="Check-Out">
          <label for="typeOut">Check-Out</label>
        </div>
      </div>

      <!-- 8. Automatic Date & Time Field -->
      <div class="mb-3">
        <label class="form-label">Current Date & Time</label>
        <input type="text" id="timeDisplay" class="form-control" readonly placeholder="Capturing time...">
      </div>

      <!-- 9. Automatic Location Field (Without Lat: / Long: prefix) -->
      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label m-0">Location</label>
          <button type="button" class="btn-refresh-icon" title="Refresh Location" onclick="fetchGPSLocation()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M2.5 22v-6h6"/>
              <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"/>
            </svg>
          </button>
        </div>
        <input type="text" id="locationDisplay" class="form-control" readonly placeholder="Acquiring GPS coordinates...">
      </div>

      <!-- 10. Read-Only Leaflet Map -->
      <div id="mapContainer"></div>

      <!-- 11. Remarks -->
      <div class="mb-4">
        <label class="form-label">Remarks <span class="text-muted fw-normal">(Optional)</span></label>
        <textarea id="remarks" class="form-control" rows="2" placeholder="Write any optional notes..."></textarea>
      </div>

      <!-- 12. Submit Button -->
      <button type="submit" id="submitBtn" class="btn btn-submit w-100">Submit Attendance</button>
    </form>
  </div>
</div>

<!-- Modern Popup Modal -->
<div id="popupModal" class="popup-backdrop popup-error">
  <div class="popup-card" tabindex="-1" id="popupCard">
    <div id="popupIcon" class="popup-icon">!</div>
    <h6 id="popupTitle" class="fw-bold mb-2">Notice</h6>
    <p id="popupMessage" class="text-muted small mb-0"></p>
    <button type="button" class="popup-btn" onclick="closePopup()">Acknowledge</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // INSERT YOUR DEPLOYED GOOGLE APPS SCRIPT URL HERE
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyLEMc5wnhuEbJXp7hP5Pmxhs4kKRU5LZABFqyd4ZnqJaWjJaVqUJhnqMFZPhXGUhFO-g/exec";

  let masterRoster = [];
  let map = null;
  let mapMarker = null;
  let capturedLat = null;
  let capturedLng = null;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Registration:', err));
  }

  window.addEventListener('load', () => {
    updateNetworkStatus();
    initClock();
    initLeafletMap();
    fetchGPSLocation();
    loadRosterData();
  });

  window.addEventListener('online', updateNetworkStatus);
  window.addEventListener('offline', updateNetworkStatus);

  // --- AUTOMATIC CLOCK ENGINE ---
  function initClock() {
    updateClock();
    setInterval(updateClock, 1000);
  }

  function updateClock() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const formatted = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    document.getElementById('timeDisplay').value = formatted;
  }

  // --- READ-ONLY MAP & GPS ENGINE ---
  function initLeafletMap() {
    map = L.map('mapContainer', {
      zoomControl: true,
      dragging: true,
      scrollWheelZoom: false
    }).setView([20.0, 0.0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);
  }

  function fetchGPSLocation() {
    const locInput = document.getElementById('locationDisplay');
    locInput.value = "Acquiring GPS coordinates...";

    if (!("geolocation" in navigator)) {
      locInput.value = "GPS Not Supported";
      return;
    }

    const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

    navigator.geolocation.getCurrentPosition(
      (position) => {
        capturedLat = position.coords.latitude.toFixed(6);
        capturedLng = position.coords.longitude.toFixed(6);
        // Clean format without "Lat:" and "Long:"
        locInput.value = `${capturedLat}, ${capturedLng}`;

        const latLng = [parseFloat(capturedLat), parseFloat(capturedLng)];
        map.setView(latLng, 16);

        if (mapMarker) {
          mapMarker.setLatLng(latLng);
        } else {
          mapMarker = L.marker(latLng).addTo(map);
        }
      },
      (error) => {
        // Fallback: Low accuracy location
        navigator.geolocation.getCurrentPosition(
          (fallbackPos) => {
            capturedLat = fallbackPos.coords.latitude.toFixed(6);
            capturedLng = fallbackPos.coords.longitude.toFixed(6);
            locInput.value = `${capturedLat}, ${capturedLng}`;

            const latLng = [parseFloat(capturedLat), parseFloat(capturedLng)];
            map.setView(latLng, 15);
            if (mapMarker) mapMarker.setLatLng(latLng);
            else mapMarker = L.marker(latLng).addTo(map);
          },
          (err) => {
            locInput.value = "GPS Access Denied / Unavailable";
            showPopup("GPS Required", "Please allow location permissions and tap the refresh button.", "error");
          },
          { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
        );
      },
      options
    );
  }

  // --- NETWORK & SYNC CHIP CONTROLLER ---
  function updateNetworkStatus() {
    const statusEl = document.getElementById('networkStatus');
    if (navigator.onLine) {
      statusEl.className = "chip-badge chip-online";
      statusEl.textContent = "● Online";
      syncOfflineQueue();
    } else {
      statusEl.className = "chip-badge chip-offline";
      statusEl.textContent = "● Offline";
    }
    updateQueueBadge();
  }

  function updateQueueBadge() {
    const queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    const badge = document.getElementById('queueStatus');
    const count = queue.length;

    if (count > 0) {
      badge.className = "chip-badge chip-sync has-pending";
      badge.textContent = `Sync Queue: ${count} Pending`;
    } else {
      badge.className = "chip-badge chip-sync";
      badge.textContent = `Sync Queue: 0`;
    }
  }

  // --- CASCADING DROPDOWNS ---
  function loadRosterData() {
    if (navigator.onLine) {
      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getEmployees' })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'SUCCESS' && res.employees) {
          masterRoster = res.employees;
          localStorage.setItem('employee_roster_cache', JSON.stringify(masterRoster));
          initProjectDropdown();
        } else {
          loadRosterFromCache();
        }
      })
      .catch(() => loadRosterFromCache());
    } else {
      loadRosterFromCache();
    }
  }

  function loadRosterFromCache() {
    const cache = localStorage.getItem('employee_roster_cache');
    if (cache) {
      masterRoster = JSON.parse(cache);
      initProjectDropdown();
    } else {
      showPopup("No Roster Cache", "Please connect online once to load employee data.", "error");
    }
  }

  function initProjectDropdown() {
    const projects = [...new Set(masterRoster.map(e => e.project))].filter(Boolean);
    populateSelect('project', projects, '-- Select Project --');
    resetDownstream('project');
  }

  function onProjectChange() {
    const proj = document.getElementById('project').value;
    if (!proj) { resetDownstream('project'); return; }

    const filtered = masterRoster.filter(e => e.project === proj);
    const orgs = [...new Set(filtered.map(e => e.organization))].filter(Boolean);

    populateSelect('organization', orgs, '-- Select Organization --');
    document.getElementById('organization').disabled = false;
    resetDownstream('organization');
  }

  function onOrganizationChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    if (!org) { resetDownstream('organization'); return; }

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org);
    const dists = [...new Set(filtered.map(e => e.district))].filter(Boolean);

    populateSelect('district', dists, '-- Select District --');
    document.getElementById('district').disabled = false;
    resetDownstream('district');
  }

  function onDistrictChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    if (!dist) { resetDownstream('district'); return; }

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist);
    const ucs = [...new Set(filtered.map(e => e.unionCouncil))].filter(Boolean);

    populateSelect('unionCouncil', ucs, '-- Select Union Council --');
    document.getElementById('unionCouncil').disabled = false;
    resetDownstream('unionCouncil');
  }

  function onUnionCouncilChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    if (!uc) { resetDownstream('unionCouncil'); return; }

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc);
    const names = [...new Set(filtered.map(e => e.fullName))].filter(Boolean);

    populateSelect('fullName', names, '-- Select Full Name --');
    document.getElementById('fullName').disabled = false;
    resetDownstream('fullName');
  }

  function onFullNameChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;
    if (!name) { resetDownstream('fullName'); return; }

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc && e.fullName === name);
    const desigs = [...new Set(filtered.map(e => e.designation))].filter(Boolean);

    populateSelect('designation', desigs, '-- Select Designation --');
    document.getElementById('designation').disabled = false;
    if (desigs.length === 1) {
      document.getElementById('designation').value = desigs[0];
    }
  }

  function populateSelect(id, items, placeholder) {
    const el = document.getElementById(id);
    el.innerHTML = `<option value="">${placeholder}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
  }

  function resetDownstream(level) {
    const seq = ['project', 'organization', 'district', 'unionCouncil', 'fullName', 'designation'];
    const startIndex = seq.indexOf(level) + 1;

    for (let i = startIndex; i < seq.length; i++) {
      const field = document.getElementById(seq[i]);
      field.innerHTML = `<option value="">-- Select ${formatLabel(seq[i - 1])} First --</option>`;
      field.disabled = true;
      field.value = "";
    }
  }

  function formatLabel(s) {
    return s.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
  }

  // --- OFFLINE SAME DAY VALIDATION ---
  function validateOfflineFlow(name, type, todayStr) {
    const queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    const todayRecords = queue.filter(r => 
      r.fullName.trim().toLowerCase() === name.trim().toLowerCase() && 
      r.time.startsWith(todayStr)
    );

    const hasCheckIn = todayRecords.some(r => r.type === 'Check-In');
    const hasCheckOut = todayRecords.some(r => r.type === 'Check-Out');

    if (type === 'Check-Out' && !hasCheckIn) {
      return { valid: false, msg: `Offline Block: ${name} has not checked in locally today (${todayStr}).` };
    }
    if (type === 'Check-In' && hasCheckIn) {
      return { valid: false, msg: `Offline Block: ${name} already checked in locally today (${todayStr}).` };
    }
    if (type === 'Check-Out' && hasCheckOut) {
      return { valid: false, msg: `Offline Block: ${name} already checked out locally today (${todayStr}).` };
    }
    return { valid: true };
  }

  // --- FORM SUBMIT HANDLER ---
  document.getElementById('attendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const timeVal = document.getElementById('timeDisplay').value;
    const locVal = document.getElementById('locationDisplay').value;

    if (!locVal || locVal.includes("Acquiring") || locVal.includes("Denied") || locVal.includes("Unavailable")) {
      showPopup("GPS Location Required", "Valid location coordinates are required. Tap the refresh icon to acquire location.", "error");
      return;
    }

    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;
    const desig = document.getElementById('designation').value;
    const type = document.querySelector('input[name="type"]:checked').value;
    const remarks = document.getElementById('remarks').value;

    if (!proj || !org || !dist || !uc || !name || !desig) {
      showPopup("Incomplete Form", "Please select all required dropdown fields.", "error");
      return;
    }

    const todayStr = timeVal.split(' ')[0];

    const record = {
      uid: 'UID-' + Date.now(),
      email: 'pwa-user@app.local',
      project: proj,
      organization: org,
      district: dist,
      unionCouncil: uc,
      fullName: name,
      designation: desig,
      type: type,
      time: timeVal,
      location: locVal,
      remarks: remarks
    };

    if (navigator.onLine) {
      sendToServer(record);
    } else {
      // Local queue validation
      const check = validateOfflineFlow(name, type, todayStr);
      if (!check.valid) {
        showPopup("Validation Error", check.msg, "error");
        return;
      }
      saveLocally(record);
      showPopup("Saved Offline", "Record stored locally. It will auto-sync when online.", "success");
      resetForm();
    }
  });

  function sendToServer(record) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "Submitting...";

    fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'submitAttendance', record: record })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.textContent = "Submit Attendance";

      if (res.status === 'SUCCESS') {
        showPopup("Success", `${record.type} recorded for ${record.fullName}!`, "success");
        resetForm();
      } else if (res.status === 'VALIDATION_FAILED') {
        showPopup("Denied by Server", res.message, "error");
      } else {
        saveLocally(record);
        showPopup("Saved Offline", "Server error. Saved to offline queue.", "success");
        resetForm();
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "Submit Attendance";
      saveLocally(record);
      showPopup("Saved Offline", "Network issue. Saved to offline queue.", "success");
      resetForm();
    });
  }

  function saveLocally(record) {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    queue.push(record);
    localStorage.setItem('offline_attendance_queue', JSON.stringify(queue));
    updateQueueBadge();
  }

  function syncOfflineQueue() {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    if (queue.length === 0) return;

    let completed = 0;
    queue.forEach(record => {
      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'submitAttendance', record: record })
      })
      .then(() => {
        completed++;
        if (completed === queue.length) {
          localStorage.setItem('offline_attendance_queue', JSON.stringify([]));
          updateQueueBadge();
          showPopup("Queue Synced", "All pending offline records synced to Google Sheets!", "success");
        }
      });
    });
  }

  function resetForm() {
    document.getElementById('attendanceForm').reset();
    document.getElementById('typeIn').checked = true;
    initProjectDropdown();
    fetchGPSLocation();
  }

  // --- POPUP CONTROLLER ---
  function showPopup(title, message, type = "error") {
    const modal = document.getElementById('popupModal');
    const card = document.getElementById('popupCard');
    const icon = document.getElementById('popupIcon');

    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupMessage').textContent = message;

    if (type === "success") {
      modal.className = "popup-backdrop popup-success active";
      icon.textContent = "✓";
    } else {
      modal.className = "popup-backdrop popup-error active";
      icon.textContent = "!";
    }

    card.focus();
  }

  function closePopup() {
    const modal = document.getElementById('popupModal');
    modal.classList.remove('active');
  }
</script>
</body>
</html>
