<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance & Leave Portal</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .leaflet-container { width: 100%; height: 100%; border-radius: 1rem; }
  </style>
</head>
<body class="bg-slate-100/80 text-slate-900 min-h-screen flex items-center justify-center p-3 sm:p-6">

  <!-- Mobile Container Frame -->
  <div class="w-full max-w-md bg-white rounded-[32px] p-5 sm:p-6 shadow-xl shadow-slate-200/60 border border-slate-200/80 flex flex-col justify-between my-auto">
    
    <div>
      <!-- Top Navigation & Status Bar -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
        <div>
          <span class="text-[11px] font-bold text-blue-600 uppercase tracking-wider">Verification Engine</span>
          <h1 class="text-xl font-bold text-slate-900 mt-0.5">Attendance Portal</h1>
        </div>
        <div class="flex items-center gap-2">
          <div id="queueBadge" class="hidden items-center text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200/60 px-2.5 py-1 rounded-full">
            Sync: <span id="queueCount" class="ml-1 font-bold">0</span>
          </div>
          <div id="networkBadge" class="flex items-center gap-1.5 bg-emerald-50 border border-emerald-200/60 text-emerald-700 px-3 py-1 rounded-full text-xs font-semibold">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="networkText">Online</span>
          </div>
        </div>
      </div>

      <!-- User Profile Header Card -->
      <div class="bg-slate-50 border border-slate-200/60 rounded-2xl p-4 mb-5 relative">
        <div class="flex items-center gap-3.5">
          <div id="avatarInitials" class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-bold text-base flex items-center justify-center shadow-md shadow-blue-500/20 shrink-0">
            --
          </div>
          <div class="flex-1 min-w-0">
            <h2 id="cardFullName" class="text-sm font-bold text-slate-900 truncate">Select Profile</h2>
            <p id="cardEmail" class="text-xs text-slate-500 truncate">Tap Edit to configure profile</p>
          </div>
          <button type="button" onclick="openProfileModal()" class="text-xs font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100/80 px-3 py-1.5 rounded-lg transition-colors shrink-0">
            Edit
          </button>
        </div>
        <div class="mt-3.5 pt-3 border-t border-slate-200/60 flex items-center justify-between text-xs text-slate-600">
          <span id="cardDistrict" class="font-medium text-slate-500 truncate max-w-[45%]">No District</span>
          <span class="text-slate-300">•</span>
          <span id="cardProject" class="font-medium text-slate-500 truncate max-w-[45%]">No Project</span>
        </div>
      </div>

      <!-- Segmented Submission Tabs -->
      <div class="mb-5">
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Submission Type</label>
        <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1.5 rounded-2xl border border-slate-200/50">
          <button type="button" id="tabIn" onclick="selectType('Check-In')" class="py-2.5 text-xs font-semibold rounded-xl bg-white text-blue-600 shadow-sm transition-all">Check-In</button>
          <button type="button" id="tabOut" onclick="selectType('Check-Out')" class="py-2.5 text-xs font-medium text-slate-600 hover:text-slate-900 transition-all">Check-Out</button>
          <button type="button" id="tabLeave" onclick="selectType('Leave')" class="py-2.5 text-xs font-medium text-slate-600 hover:text-slate-900 transition-all">Leave</button>
        </div>
      </div>

      <!-- Dynamic Leave Panel -->
      <div id="leavePanel" class="hidden mb-5 p-4 bg-amber-50/60 border border-amber-200/60 rounded-2xl space-y-3">
        <div>
          <label class="block text-xs font-bold text-amber-900/70 uppercase tracking-wider mb-1">Leave Category</label>
          <select id="leaveCategory" class="w-full px-3 py-2 text-xs font-medium bg-white border border-amber-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
            <option value="Casual Leave">Casual Leave</option>
            <option value="Annual Leave">Annual Leave</option>
            <option value="Sick / Medical Leave">Sick / Medical Leave</option>
            <option value="Maternity Leave">Maternity Leave</option>
            <option value="Paternity Leave">Paternity Leave</option>
            <option value="Compassionate Leave">Compassionate Leave</option>
            <option value="Unpaid Leave">Unpaid Leave</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-amber-900/70 uppercase tracking-wider mb-1">Select Date(s)</label>
          <input type="text" id="leaveDatesPicker" placeholder="Tap to pick leave dates" class="w-full px-3 py-2 text-xs bg-white border border-amber-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
        </div>
      </div>

      <!-- Location Card & Verification -->
      <div class="mb-5">
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">GPS Verification</label>
          <span id="liveClock" class="text-xs font-mono font-medium text-slate-500">--/--/---- • --:--:--</span>
        </div>

        <div class="relative h-36 w-full rounded-2xl bg-slate-100 border border-slate-200/80 overflow-hidden">
          <div id="map" class="w-full h-full"></div>
          <div class="absolute bottom-2 left-1/2 -translate-x-1/2 z-[1000]">
            <span id="gpsBadge" class="bg-white/95 backdrop-blur-sm px-3 py-1 rounded-full text-[11px] font-mono font-medium text-slate-700 shadow-sm border border-slate-200 flex items-center gap-1.5 whitespace-nowrap">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-ping"></span>
              Acquiring GPS...
            </span>
          </div>
          <button type="button" onclick="fetchGPS(true)" class="absolute top-2 right-2 z-[1000] bg-white/90 backdrop-blur-sm p-1.5 rounded-lg shadow-sm border border-slate-200 text-slate-600 hover:text-blue-600 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
        </div>
      </div>

      <!-- Remarks Input -->
      <div class="mb-6">
        <label for="notes" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Remarks <span class="text-slate-400 font-normal">(Optional)</span></label>
        <input type="text" id="notes" placeholder="Add optional check-in notes..." class="w-full px-4 py-3 text-sm bg-slate-50 border border-slate-200/80 rounded-xl focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all placeholder:text-slate-400">
      </div>
    </div>

    <!-- Confirm Submit Button -->
    <button type="button" id="submitBtn" onclick="submitEntry()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-600/25 transition-all flex items-center justify-center gap-2">
      <span id="submitBtnText">Confirm Check-In</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </button>

  </div>

  <!-- Profile Configuration Modal -->
  <div id="profileModal" class="fixed inset-0 z-[10000] bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
        <h3 class="text-base font-bold text-slate-900">Configure Profile</h3>
        <button type="button" onclick="closeProfileModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
      </div>

      <form id="profileForm" class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email <span class="text-rose-500">*</span></label>
          <input type="email" id="modalEmail" placeholder="name@org.com" required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Project <span class="text-rose-500">*</span></label>
          <select id="modalProject" onchange="onProjectChange()" required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600">
            <option value="">-- Select Project --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Organization <span class="text-rose-500">*</span></label>
          <select id="modalOrg" onchange="onOrgChange()" disabled required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600">
            <option value="">-- Select Org --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">District <span class="text-rose-500">*</span></label>
          <select id="modalDistrict" onchange="onDistrictChange()" disabled required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600">
            <option value="">-- Select District --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Union Council <span class="text-rose-500">*</span></label>
          <select id="modalUC" onchange="onUCChange()" disabled required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600">
            <option value="">-- Select UC --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Full Name <span class="text-rose-500">*</span></label>
          <select id="modalFullName" onchange="onFullNameChange()" disabled required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600">
            <option value="">-- Select Name --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Designation <span class="text-rose-500">*</span></label>
          <select id="modalDesignation" disabled required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600">
            <option value="">-- Select Designation --</option>
          </select>
        </div>

        <button type="button" onclick="saveProfile()" class="w-full mt-2 py-3 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-md hover:bg-blue-700 transition-colors">
          Save Profile
        </button>
      </form>
    </div>
  </div>

  <!-- Notification Modal -->
  <div id="noticeModal" class="fixed inset-0 z-[10000] bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-xs w-full p-5 text-center shadow-2xl border border-slate-100">
      <div id="noticeIcon" class="w-10 h-10 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-lg">!</div>
      <h4 id="noticeTitle" class="text-sm font-bold text-slate-900 mb-1">Notification</h4>
      <p id="noticeMsg" class="text-xs text-slate-500 mb-4 leading-relaxed"></p>
      <button type="button" onclick="closeNotice()" class="w-full py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl hover:bg-slate-800 transition-colors">Acknowledge</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyLEMc5wnhuEbJXp7hP5Pmxhs4kKRU5LZABFqyd4ZnqJaWjJaVqUJhnqMFZPhXGUhFO-g/exec";

    let activeType = "Check-In";
    let masterRoster = [];
    let map = null, mapMarker = null;
    let flatpickrInst = null;
    let currentGPSCoords = null;

    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      initClock();
      initMap();
      initDatePicker();
      updateNetworkStatus();
      loadSavedProfile();
      loadRoster();
      fetchGPS();

      if (navigator.onLine) syncQueue();
    });

    window.addEventListener('online', () => { updateNetworkStatus(); syncQueue(); });
    window.addEventListener('offline', updateNetworkStatus);

    /* LIVE CLOCK */
    function initClock() {
      setInterval(() => {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        const formatted = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} • ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        document.getElementById('liveClock').textContent = formatted;
      }, 1000);
    }

    /* MAP & GPS ENGINE */
    function initMap() {
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.0, 0.0], 2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    }

    function fetchGPS(force = false) {
      const badge = document.getElementById('gpsBadge');
      if (!navigator.geolocation) {
        badge.textContent = "GPS Not Supported";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          currentGPSCoords = `${lat}, ${lng}`;
          badge.textContent = currentGPSCoords;

          map.setView([lat, lng], 16);
          if (mapMarker) mapMarker.setLatLng([lat, lng]);
          else mapMarker = L.marker([lat, lng]).addTo(map);
        },
        () => {
          badge.textContent = currentGPSCoords || "GPS Access Denied";
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: force ? 0 : 5000 }
      );
    }

    /* SUBMISSION TYPE TOGGLE */
    function selectType(type) {
      activeType = type;
      const tabs = { 'Check-In': 'tabIn', 'Check-Out': 'tabOut', 'Leave': 'tabLeave' };
      
      Object.keys(tabs).forEach(t => {
        const el = document.getElementById(tabs[t]);
        if (t === type) {
          el.className = "py-2.5 text-xs font-semibold rounded-xl bg-white text-blue-600 shadow-sm transition-all";
        } else {
          el.className = "py-2.5 text-xs font-medium text-slate-600 hover:text-slate-900 transition-all";
        }
      });

      const leavePanel = document.getElementById('leavePanel');
      const submitText = document.getElementById('submitBtnText');
      if (type === 'Leave') {
        leavePanel.classList.remove('hidden');
        submitText.textContent = "Confirm Leave Request";
      } else {
        leavePanel.classList.add('hidden');
        submitText.textContent = `Confirm ${type}`;
      }
    }

    /* PROFILE MANAGEMENT */
    function loadSavedProfile() {
      const prof = JSON.parse(localStorage.getItem('user_profile_cache') || '{}');
      if (prof.fullName) {
        document.getElementById('cardFullName').textContent = prof.fullName;
        document.getElementById('cardEmail').textContent = prof.email || '';
        document.getElementById('cardDistrict').textContent = prof.district || 'District';
        document.getElementById('cardProject').textContent = prof.project || 'Project';

        const initials = prof.fullName.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        document.getElementById('avatarInitials').textContent = initials;
      }
    }

    function openProfileModal() {
      document.getElementById('profileModal').classList.remove('hidden');
      document.getElementById('profileModal').classList.add('flex');
    }
    function closeProfileModal() {
      document.getElementById('profileModal').classList.add('hidden');
      document.getElementById('profileModal').classList.remove('flex');
    }

    function saveProfile() {
      const email = document.getElementById('modalEmail').value.trim();
      const proj = document.getElementById('modalProject').value;
      const org = document.getElementById('modalOrg').value;
      const dist = document.getElementById('modalDistrict').value;
      const uc = document.getElementById('modalUC').value;
      const name = document.getElementById('modalFullName').value;
      const desig = document.getElementById('modalDesignation').value;

      if (!email || !proj || !org || !dist || !uc || !name || !desig) {
        showNotice("Incomplete Profile", "Please fill in all profile fields.", "error");
        return;
      }

      const prof = { email, project: proj, organization: org, district: dist, unionCouncil: uc, fullName: name, designation: desig };
      localStorage.setItem('user_profile_cache', JSON.stringify(prof));
      loadSavedProfile();
      closeProfileModal();
      showNotice("Profile Saved", "Your roster details have been updated.", "success");
    }

    /* ROSTER CASCADE DROPDOWNS */
    function loadRoster() {
      const cached = localStorage.getItem('employee_roster_cache');
      if (cached) { masterRoster = JSON.parse(cached); initProjectDropdown(); }

      if (navigator.onLine && GAS_API_URL !== "YOUR_DEPLOYED_WEB_APP_URL_HERE") {
        fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getEmployees' }) })
          .then(r => r.json())
          .then(res => {
            if (res.status === 'SUCCESS' && res.employees) {
              masterRoster = res.employees;
              localStorage.setItem('employee_roster_cache', JSON.stringify(masterRoster));
              initProjectDropdown();
            }
          }).catch(() => {});
      }
    }

    function initProjectDropdown() {
      const projs = [...new Set(masterRoster.map(e => e.project))].filter(Boolean);
      populateSelect('modalProject', projs, '-- Select Project --');
    }

    function onProjectChange() {
      const proj = document.getElementById('modalProject').value;
      const filtered = masterRoster.filter(e => e.project === proj);
      populateSelect('modalOrg', [...new Set(filtered.map(e => e.organization))].filter(Boolean), '-- Select Org --');
      document.getElementById('modalOrg').disabled = false;
    }

    function onOrgChange() {
      const proj = document.getElementById('modalProject').value;
      const org = document.getElementById('modalOrg').value;
      const filtered = masterRoster.filter(e => e.project === proj && e.organization === org);
      populateSelect('modalDistrict', [...new Set(filtered.map(e => e.district))].filter(Boolean), '-- Select District --');
      document.getElementById('modalDistrict').disabled = false;
    }

    function onDistrictChange() {
      const proj = document.getElementById('modalProject').value;
      const org = document.getElementById('modalOrg').value;
      const dist = document.getElementById('modalDistrict').value;
      const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist);
      populateSelect('modalUC', [...new Set(filtered.map(e => e.unionCouncil))].filter(Boolean), '-- Select UC --');
      document.getElementById('modalUC').disabled = false;
    }

    function onUCChange() {
      const proj = document.getElementById('modalProject').value;
      const org = document.getElementById('modalOrg').value;
      const dist = document.getElementById('modalDistrict').value;
      const uc = document.getElementById('modalUC').value;
      const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc);
      populateSelect('modalFullName', [...new Set(filtered.map(e => e.fullName))].filter(Boolean), '-- Select Name --');
      document.getElementById('modalFullName').disabled = false;
    }

    function onFullNameChange() {
      const proj = document.getElementById('modalProject').value;
      const org = document.getElementById('modalOrg').value;
      const dist = document.getElementById('modalDistrict').value;
      const uc = document.getElementById('modalUC').value;
      const name = document.getElementById('modalFullName').value;
      const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc && e.fullName === name);
      const desigs = [...new Set(filtered.map(e => e.designation))].filter(Boolean);
      populateSelect('modalDesignation', desigs, '-- Select Designation --');
      document.getElementById('modalDesignation').disabled = false;
      if (desigs.length === 1) document.getElementById('modalDesignation').value = desigs[0];
    }

    function populateSelect(id, items, placeholder) {
      const el = document.getElementById(id);
      el.innerHTML = `<option value="">${placeholder}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
    }

    /* SUBMISSION HANDLER */
    function submitEntry() {
      const prof = JSON.parse(localStorage.getItem('user_profile_cache') || '{}');
      if (!prof.fullName) {
        openProfileModal();
        showNotice("Profile Required", "Please configure your profile details first.", "error");
        return;
      }

      if (!currentGPSCoords) {
        showNotice("Location Required", "Acquiring GPS location. Please wait a moment.", "error");
        fetchGPS(true);
        return;
      }

      const timeText = document.getElementById('liveClock').textContent.replace(' • ', ' ');
      const remarks = document.getElementById('notes').value.trim();

      let record = {
        uid: 'UID-' + Date.now(),
        email: prof.email,
        project: prof.project,
        organization: prof.organization,
        district: prof.district,
        unionCouncil: prof.unionCouncil,
        fullName: prof.fullName,
        designation: prof.designation,
        type: activeType,
        time: timeText,
        location: currentGPSCoords,
        remarks: remarks
      };

      if (activeType === 'Leave') {
        const datesStr = document.getElementById('leaveDatesPicker').value;
        if (!datesStr) {
          showNotice("Dates Missing", "Please select leave date(s).", "error");
          return;
        }
        const dates = datesStr.split(', ').map(d => d.trim());
        record.leaveCategory = document.getElementById('leaveCategory').value;
        record.leaveDates = dates;
        record.time = `${dates[0]} 09:00:00`;
      }

      if (navigator.onLine && GAS_API_URL !== "YOUR_DEPLOYED_WEB_APP_URL_HERE") {
        sendToServer(record);
      } else {
        queueOffline(record);
        showNotice("Saved Offline", "No internet connection. Entry queued locally.", "warning");
        document.getElementById('notes').value = '';
      }
    }

    function sendToServer(record) {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      document.getElementById('submitBtnText').textContent = "Submitting...";

      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'submitAttendance', record: record })
      })
      .then(r => r.json())
      .then(res => {
        btn.disabled = false;
        selectType(activeType);

        if (res.status === 'SUCCESS' || res.status === 'SUCCESS_LEAVE') {
          showNotice("Success", `Attendance recorded for ${record.fullName}.`, "success");
          document.getElementById('notes').value = '';
        } else {
          queueOffline(record);
          showNotice("Queued Offline", res.message || "Server issue. Saved locally.", "warning");
        }
      })
      .catch(() => {
        btn.disabled = false;
        selectType(activeType);
        queueOffline(record);
        showNotice("Saved Offline", "Connection issue. Saved locally for background sync.", "warning");
      });
    }

    function queueOffline(record) {
      let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
      queue.push(record);
      localStorage.setItem('offline_attendance_queue', JSON.stringify(queue));
      updateNetworkStatus();
    }

    async function syncQueue() {
      let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
      if (queue.length === 0 || GAS_API_URL === "YOUR_DEPLOYED_WEB_APP_URL_HERE") return;

      let remaining = [];
      let synced = 0;

      for (const rec of queue) {
        try {
          const res = await fetch(GAS_API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'submitAttendance', record: rec })
          }).then(r => r.json());

          if (res.status === 'SUCCESS' || res.status === 'SUCCESS_LEAVE') synced++;
          else remaining.push(rec);
        } catch (e) {
          remaining.push(rec);
        }
      }

      localStorage.setItem('offline_attendance_queue', JSON.stringify(remaining));
      updateNetworkStatus();
      if (synced > 0) showNotice("Synced", `${synced} offline entry(s) pushed to Google Sheets.`, "success");
    }

    /* UI UTILITIES */
    function initDatePicker() {
      flatpickrInst = flatpickr("#leaveDatesPicker", { mode: "multiple", dateFormat: "d/m/Y", conjunction: ", ", minDate: "today" });
    }

    function updateNetworkStatus() {
      const badge = document.getElementById('networkBadge');
      const text = document.getElementById('networkText');
      const queueBadge = document.getElementById('queueBadge');
      const queueCount = document.getElementById('queueCount');

      const queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');

      if (navigator.onLine) {
        badge.className = "flex items-center gap-1.5 bg-emerald-50 border border-emerald-200/60 text-emerald-700 px-3 py-1 rounded-full text-xs font-semibold";
        text.textContent = "Online";
      } else {
        badge.className = "flex items-center gap-1.5 bg-amber-50 border border-amber-200/60 text-amber-700 px-3 py-1 rounded-full text-xs font-semibold";
        text.textContent = "Offline";
      }

      if (queue.length > 0) {
        queueBadge.classList.remove('hidden');
        queueBadge.classList.add('flex');
        queueCount.textContent = queue.length;
      } else {
        queueBadge.classList.add('hidden');
        queueBadge.classList.remove('flex');
      }
    }

    function showNotice(title, msg, type = "error") {
      const modal = document.getElementById('noticeModal');
      const icon = document.getElementById('noticeIcon');
      document.getElementById('noticeTitle').textContent = title;
      document.getElementById('noticeMsg').textContent = msg;

      if (type === "success") {
        icon.className = "w-10 h-10 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-lg bg-emerald-100 text-emerald-700";
        icon.textContent = "✓";
      } else if (type === "warning") {
        icon.className = "w-10 h-10 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-lg bg-amber-100 text-amber-700";
        icon.textContent = "!";
      } else {
        icon.className = "w-10 h-10 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-lg bg-rose-100 text-rose-700";
        icon.textContent = "✕";
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeNotice() {
      document.getElementById('noticeModal').classList.add('hidden');
      document.getElementById('noticeModal').classList.remove('flex');
    }
  </script>
</body>
</html>
