<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Attendance & Leave Portal</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #e2e8f0;
      --readonly-bg: #f8fafc;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      padding-top: 16px;
      padding-bottom: 40px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
    }

    .card-custom {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      padding: 24px 20px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .chip-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
    }

    .chip-online { background-color: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .chip-offline { background-color: #fffbeb; color: #92400e; border-color: #fef3c7; }
    
    .chip-sync {
      background-color: #f1f5f9;
      color: #334155;
      border-color: #e2e8f0;
    }

    .chip-sync.has-pending {
      background-color: #eff6ff;
      color: #1e40af;
      border-color: #bfdbfe;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.8rem;
      color: #334155;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .form-select, .form-control {
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      padding: 11px 14px;
      font-size: 0.92rem;
      color: var(--text-main);
      background-color: #ffffff;
      transition: all 0.2s ease;
    }

    .form-select:focus, .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .form-control[readonly] {
      background-color: var(--readonly-bg);
      color: #475569;
      font-weight: 500;
    }

    .segmented-control {
      display: flex;
      background-color: #f1f5f9;
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      gap: 4px;
    }

    .segmented-control input[type="radio"] { display: none; }

    .segmented-control label {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
      font-weight: 600;
      font-size: 0.84rem;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }

    .segmented-control input[type="radio"]:checked + label {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    /* YELLOW LEAVE BUTTON STYLING */
    .segmented-control input[id="typeLeave"]:checked + label {
      background-color: #eab308 !important;
      color: #0f172a !important;
      box-shadow: 0 2px 8px rgba(234, 179, 8, 0.35) !important;
    }

    .leave-panel {
      background-color: #fefce8;
      border: 1.5px solid #fef08a;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      display: none;
    }

    .leave-panel.active { display: block; }

    .btn-refresh-icon {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      color: #475569;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    #mapContainer {
      height: 160px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .btn-submit {
      background-color: var(--primary);
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-weight: 600;
      font-size: 0.98rem;
      color: #ffffff;
      transition: background-color 0.2s ease;
    }

    .popup-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      opacity: 0; visibility: hidden;
      transition: all 0.2s ease;
      padding: 20px;
    }

    .popup-backdrop.active { opacity: 1; visibility: visible; }

    .popup-card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 380px; width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
    }

    .popup-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
      margin: 0 auto 14px auto;
    }

    .popup-error .popup-icon { background: #fee2e2; color: #dc2626; }
    .popup-success .popup-icon { background: #dcfce7; color: #166534; }

    .popup-btn {
      border: none; border-radius: 10px;
      padding: 10px 18px; font-weight: 600;
      width: 100%; margin-top: 16px;
    }

    .popup-error .popup-btn { background: #dc2626; color: white; }
    .popup-success .popup-btn { background: #166534; color: white; }
  </style>
</head>
<body>

<div class="container app-container">

  <div class="status-bar">
    <span id="networkStatus" class="chip-badge chip-online">● Online</span>
    <span id="queueStatus" class="chip-badge chip-sync">Sync Queue: 0</span>
  </div>

  <div class="card-custom">
    <div class="text-center mb-4">
      <h5 class="fw-bold m-0" style="color: var(--text-main);">Attendance & Leave Portal</h5>
      <p class="text-muted small m-0 mt-1">Multi-Date Leave & Location Sync</p>
    </div>

    <form id="attendanceForm">
      
      <!-- User Email Input -->
      <div class="mb-3">
        <label class="form-label">Official Email Address <span class="text-danger">*</span></label>
        <input type="email" id="userEmail" class="form-control" placeholder="name@organization.com" required onchange="localStorage.setItem('saved_user_email', this.value)">
      </div>

      <!-- Project -->
      <div class="mb-3">
        <label class="form-label">Project <span class="text-danger">*</span></label>
        <select id="project" class="form-select" onchange="onProjectChange()" required>
          <option value="">-- Select Project --</option>
        </select>
      </div>

      <!-- Organization -->
      <div class="mb-3">
        <label class="form-label">Organization <span class="text-danger">*</span></label>
        <select id="organization" class="form-select" onchange="onOrganizationChange()" required disabled>
          <option value="">-- Select Project First --</option>
        </select>
      </div>

      <!-- District -->
      <div class="mb-3">
        <label class="form-label">District <span class="text-danger">*</span></label>
        <select id="district" class="form-select" onchange="onDistrictChange()" required disabled>
          <option value="">-- Select Organization First --</option>
        </select>
      </div>

      <!-- Union Council -->
      <div class="mb-3">
        <label class="form-label">Union Council <span class="text-danger">*</span></label>
        <select id="unionCouncil" class="form-select" onchange="onUnionCouncilChange()" required disabled>
          <option value="">-- Select District First --</option>
        </select>
      </div>

      <!-- Full Name -->
      <div class="mb-3">
        <label class="form-label">Full Name <span class="text-danger">*</span></label>
        <select id="fullName" class="form-select" onchange="onFullNameChange()" required disabled>
          <option value="">-- Select Union Council First --</option>
        </select>
      </div>

      <!-- Designation -->
      <div class="mb-3">
        <label class="form-label">Designation <span class="text-danger">*</span></label>
        <select id="designation" class="form-select" required disabled>
          <option value="">-- Select Full Name First --</option>
        </select>
      </div>

      <!-- Attendance Type -->
      <div class="mb-3">
        <label class="form-label d-block">Attendance Type <span class="text-danger">*</span></label>
        <div class="segmented-control">
          <input type="radio" name="type" id="typeIn" value="Check-In" checked onchange="toggleAttendanceType()">
          <label for="typeIn">Check-In</label>
          
          <input type="radio" name="type" id="typeOut" value="Check-Out" onchange="toggleAttendanceType()">
          <label for="typeOut">Check-Out</label>

          <input type="radio" name="type" id="typeLeave" value="Leave" onchange="toggleAttendanceType()">
          <label for="typeLeave">Leave</label>
        </div>
      </div>

      <!-- LEAVE OPTIONS PANEL (DYNAMICALLY SHOWN ON LEAVE SELECTION) -->
      <div id="leavePanel" class="leave-panel">
        <div class="mb-3">
          <label class="form-label">Leave Category <span class="text-danger">*</span></label>
          <select id="leaveCategory" class="form-select">
            <option value="Casual Leave">Casual Leave</option>
            <option value="Annual Leave">Annual Leave</option>
            <option value="Sick / Medical Leave">Sick / Medical Leave</option>
            <option value="Maternity Leave">Maternity Leave</option>
            <option value="Paternity Leave">Paternity Leave</option>
            <option value="Compassionate / Bereavement Leave">Compassionate / Bereavement Leave</option>
            <option value="Unpaid / Without Pay Leave">Unpaid / Without Pay Leave</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="mb-0">
          <label class="form-label">Select Leave Date(s) <span class="text-danger">*</span></label>
          <input type="text" id="leaveDatesPicker" class="form-control" placeholder="Tap to select dates (Multiple selection enabled)">
        </div>
      </div>

      <!-- Current Time Display (For Check-In / Check-Out) -->
      <div class="mb-3" id="timeFieldContainer">
        <label class="form-label">Current Date & Time</label>
        <input type="text" id="timeDisplay" class="form-control" readonly placeholder="Capturing time...">
      </div>

      <!-- Location -->
      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label m-0">Location</label>
          <button type="button" class="btn-refresh-icon" title="Refresh Location" onclick="fetchGPSLocation()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <path d="M21.5 2v6h-6M2.5 22v-6h6"/>
              <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"/>
            </svg>
          </button>
        </div>
        <input type="text" id="locationDisplay" class="form-control" readonly placeholder="Acquiring GPS coordinates...">
      </div>

      <div id="mapContainer"></div>

      <!-- Remarks -->
      <div class="mb-4">
        <label class="form-label">Remarks <span class="text-muted fw-normal">(Optional / Reason for Leave)</span></label>
        <textarea id="remarks" class="form-control" rows="2" placeholder="Write any optional notes..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-submit w-100">Submit Request</button>
    </form>
  </div>
</div>

<div id="popupModal" class="popup-backdrop popup-error">
  <div class="popup-card" tabindex="-1" id="popupCard">
    <div id="popupIcon" class="popup-icon">!</div>
    <h6 id="popupTitle" class="fw-bold mb-2">Notice</h6>
    <p id="popupMessage" class="text-muted small mb-0"></p>
    <button type="button" class="popup-btn" onclick="closePopup()">Acknowledge</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
  // INSERT YOUR DEPLOYED GOOGLE APPS SCRIPT URL HERE
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyLEMc5wnhuEbJXp7hP5Pmxhs4kKRU5LZABFqyd4ZnqJaWjJaVqUJhnqMFZPhXGUhFO-g/exec";

  let masterRoster = [];
  let map = null;
  let mapMarker = null;
  let capturedLat = null;
  let capturedLng = null;
  let datePickerInstance = null;

  // Time tampering trackers
  let basePerfTime = performance.now();
  let baseRealTime = Date.now();
  let maxObservedTime = Number(localStorage.getItem('max_observed_timestamp') || Date.now());

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => reg.update());
  }

  window.addEventListener('load', () => {
    const savedEmail = localStorage.getItem('saved_user_email');
    if (savedEmail) document.getElementById('userEmail').value = savedEmail;

    updateNetworkStatus();
    initClock();
    initLeafletMap();
    initDatePicker();
    fetchGPSLocation();
    loadRosterData();
  });

  window.addEventListener('online', () => {
    updateNetworkStatus();
    syncOfflineQueue(); // Automatic sync on reconnect
  });

  window.addEventListener('offline', updateNetworkStatus);

  function initDatePicker() {
    datePickerInstance = flatpickr("#leaveDatesPicker", {
      mode: "multiple",
      dateFormat: "d/m/Y",
      minDate: "today",
      conjunction: ", "
    });
  }

  function toggleAttendanceType() {
    const isLeave = document.getElementById('typeLeave').checked;
    const leavePanel = document.getElementById('leavePanel');
    const timeContainer = document.getElementById('timeFieldContainer');

    if (isLeave) {
      leavePanel.classList.add('active');
      timeContainer.style.display = 'none';
    } else {
      leavePanel.classList.remove('active');
      timeContainer.style.display = 'block';
    }
  }

  function initClock() {
    updateClock();
    setInterval(updateClock, 1000);
  }

  function updateClock() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const formatted = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    document.getElementById('timeDisplay').value = formatted;
  }

  function isTimeTamperedOffline() {
    const now = Date.now();
    if (now < maxObservedTime - 60000) return true;
    if (now > maxObservedTime) {
      localStorage.setItem('max_observed_timestamp', String(now));
      maxObservedTime = now;
    }
    const perfElapsed = (performance.now() - basePerfTime) / 1000;
    const realElapsed = (now - baseRealTime) / 1000;
    return Math.abs(realElapsed - perfElapsed) > 120;
  }

  function checkOfflineValidation(record) {
    const localLogs = JSON.parse(localStorage.getItem('local_today_logs') || '[]');
    
    if (record.type === 'Leave') {
      const leaveDates = record.leaveDates || [];
      const duplicateFound = leaveDates.some(dateStr => {
        return localLogs.some(item => 
          item.fullName.trim().toLowerCase() === record.fullName.trim().toLowerCase() && 
          item.time.includes(dateStr)
        );
      });

      if (duplicateFound) {
        return { valid: false, message: "Leave Denied: You have already recorded leave for one or more of the selected dates locally." };
      }
    } else {
      const recordDate = record.time.split(' ')[0];
      const todayLogs = localLogs.filter(item => 
        item.fullName.trim().toLowerCase() === record.fullName.trim().toLowerCase() && 
        item.time.split(' ')[0] === recordDate
      );

      const hasCheckIn = todayLogs.some(i => i.type === 'Check-In');
      const hasCheckOut = todayLogs.some(i => i.type === 'Check-Out');
      const hasLeave = todayLogs.some(i => i.type.startsWith('Leave'));

      if (hasLeave) return { valid: false, message: `Submission Blocked: Leave already logged for ${recordDate}.` };
      if (record.type === 'Check-In' && hasCheckIn) return { valid: false, message: `Check-In Denied: Already checked in for ${recordDate}.` };
      if (record.type === 'Check-Out' && (!hasCheckIn || hasCheckOut)) return { valid: false, message: `Check-Out Denied: Invalid check-out request.` };
    }

    return { valid: true };
  }

  function saveLocalLogHistory(record) {
    let localLogs = JSON.parse(localStorage.getItem('local_today_logs') || '[]');
    localLogs.push(record);
    localStorage.setItem('local_today_logs', JSON.stringify(localLogs));
  }

  function initLeafletMap() {
    map = L.map('mapContainer', { zoomControl: true, dragging: true }).setView([20.0, 0.0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  }

  function fetchGPSLocation() {
    const locInput = document.getElementById('locationDisplay');
    locInput.value = "Acquiring GPS coordinates...";

    if (!("geolocation" in navigator)) {
      locInput.value = "GPS Not Supported";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (position) => {
        capturedLat = position.coords.latitude.toFixed(6);
        capturedLng = position.coords.longitude.toFixed(6);
        locInput.value = `${capturedLat}, ${capturedLng}`;
        const latLng = [parseFloat(capturedLat), parseFloat(capturedLng)];
        map.setView(latLng, 16);
        if (mapMarker) mapMarker.setLatLng(latLng);
        else mapMarker = L.marker(latLng).addTo(map);
      },
      () => { locInput.value = "GPS Access Denied / Unavailable"; },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function updateNetworkStatus() {
    const statusEl = document.getElementById('networkStatus');
    statusEl.className = navigator.onLine ? "chip-badge chip-online" : "chip-badge chip-offline";
    statusEl.textContent = navigator.onLine ? "● Online" : "● Offline";
    updateQueueBadge();
  }

  function updateQueueBadge() {
    const queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    const badge = document.getElementById('queueStatus');
    badge.className = queue.length > 0 ? "chip-badge chip-sync has-pending" : "chip-badge chip-sync";
    badge.textContent = `Sync Queue: ${queue.length}`;
  }

  function loadRosterData() {
    if (navigator.onLine) {
      fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getEmployees' }) })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'SUCCESS' && res.employees) {
          masterRoster = res.employees;
          localStorage.setItem('employee_roster_cache', JSON.stringify(masterRoster));
          initProjectDropdown();
        } else { loadRosterFromCache(); }
      })
      .catch(() => loadRosterFromCache());
    } else { loadRosterFromCache(); }
  }

  function loadRosterFromCache() {
    const cache = localStorage.getItem('employee_roster_cache');
    if (cache) {
      masterRoster = JSON.parse(cache);
      initProjectDropdown();
    }
  }

  function initProjectDropdown() {
    const projects = [...new Set(masterRoster.map(e => e.project))].filter(Boolean);
    populateSelect('project', projects, '-- Select Project --');
  }

  function onProjectChange() {
    const proj = document.getElementById('project').value;
    const filtered = masterRoster.filter(e => e.project === proj);
    populateSelect('organization', [...new Set(filtered.map(e => e.organization))].filter(Boolean), '-- Select Organization --');
    document.getElementById('organization').disabled = false;
  }

  function onOrganizationChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org);
    populateSelect('district', [...new Set(filtered.map(e => e.district))].filter(Boolean), '-- Select District --');
    document.getElementById('district').disabled = false;
  }

  function onDistrictChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist);
    populateSelect('unionCouncil', [...new Set(filtered.map(e => e.unionCouncil))].filter(Boolean), '-- Select Union Council --');
    document.getElementById('unionCouncil').disabled = false;
  }

  function onUnionCouncilChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc);
    populateSelect('fullName', [...new Set(filtered.map(e => e.fullName))].filter(Boolean), '-- Select Full Name --');
    document.getElementById('fullName').disabled = false;
  }

  function onFullNameChange() {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;
    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc && e.fullName === name);
    const desigs = [...new Set(filtered.map(e => e.designation))].filter(Boolean);
    populateSelect('designation', desigs, '-- Select Designation --');
    document.getElementById('designation').disabled = false;
    if (desigs.length === 1) document.getElementById('designation').value = desigs[0];
  }

  function populateSelect(id, items, placeholder) {
    const el = document.getElementById(id);
    el.innerHTML = `<option value="">${placeholder}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
  }

  // --- FORM SUBMISSION HANDLER ---
  document.getElementById('attendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();

    if (isTimeTamperedOffline()) {
      showPopup("Submission Blocked", "Time Tampering Detected! Please set your device clock to automatic time.", "error");
      return;
    }

    const email = document.getElementById('userEmail').value.trim();
    const locVal = document.getElementById('locationDisplay').value;

    if (!email || !locVal || locVal.includes("Acquiring") || locVal.includes("Denied")) {
      showPopup("Form Incomplete", "Please provide a valid email and GPS location.", "error");
      return;
    }

    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;
    const desig = document.getElementById('designation').value;
    const type = document.querySelector('input[name="type"]:checked').value;
    const remarks = document.getElementById('remarks').value;

    let record = {
      uid: 'UID-' + Date.now(),
      email: email,
      project: proj,
      organization: org,
      district: dist,
      unionCouncil: uc,
      fullName: name,
      designation: desig,
      type: type,
      time: document.getElementById('timeDisplay').value,
      location: locVal,
      remarks: remarks
    };

    if (type === 'Leave') {
      const selectedDatesStr = document.getElementById('leaveDatesPicker').value;
      if (!selectedDatesStr) {
        showPopup("Missing Dates", "Please select at least one leave date on the calendar.", "error");
        return;
      }
      const leaveDates = selectedDatesStr.split(', ').map(d => d.trim());
      record.leaveCategory = document.getElementById('leaveCategory').value;
      record.leaveDates = leaveDates;
      record.time = `${leaveDates[0]} 09:00:00`;
    }

    const offlineCheck = checkOfflineValidation(record);
    if (!offlineCheck.valid) {
      showPopup("Submission Blocked", offlineCheck.message, "error");
      return;
    }

    if (navigator.onLine) {
      sendToServer(record);
    } else {
      saveLocally(record);
      saveLocalLogHistory(record);
      showPopup("Saved Offline", "Offline mode active. Record queued and will sync automatically when online.", "success");
      resetForm();
    }
  });

  function sendToServer(record) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "Submitting...";

    fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'submitAttendance', record: record })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.textContent = "Submit Request";

      if (res.status === 'SUCCESS') {
        saveLocalLogHistory(record);
        showPopup("Success", `${record.type} recorded for ${record.fullName}!`, "success");
        resetForm();
      } 
      else if (res.status === 'SUCCESS_LEAVE') {
        saveLocalLogHistory(record);
        showPopup("Leave Submitted", res.message, "success");
        resetForm();
      }
      else if (res.status === 'VALIDATION_FAILED') {
        showPopup("Notice", res.message, "error");
      } else {
        saveLocally(record);
        showPopup("Saved Offline", "Server error. Queued for background sync.", "success");
        resetForm();
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "Submit Request";
      saveLocally(record);
      showPopup("Saved Offline", "Network drop. Saved to offline queue.", "success");
      resetForm();
    });
  }

  function saveLocally(record) {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    queue.push(record);
    localStorage.setItem('offline_attendance_queue', JSON.stringify(queue));
    updateQueueBadge();
  }

  // FAST & SMOOTH ASYNC QUEUE SYNC (CONCURRENT SAFE)
  async function syncOfflineQueue() {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    if (queue.length === 0) return;

    let remainingQueue = [];
    let syncedCount = 0;

    for (const record of queue) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitAttendance', record: record })
        });
        const res = await response.json();
        if (res.status === 'SUCCESS' || res.status === 'SUCCESS_LEAVE' || res.status === 'VALIDATION_FAILED') {
          syncedCount++;
        } else {
          remainingQueue.push(record);
        }
      } catch (err) {
        remainingQueue.push(record);
      }
    }

    localStorage.setItem('offline_attendance_queue', JSON.stringify(remainingQueue));
    updateQueueBadge();

    if (syncedCount > 0) {
      showPopup("Sync Complete", `${syncedCount} offline record(s) processed. Any existing duplicate dates were automatically ignored.`, "success");
    }
  }

  function resetForm() {
    const savedEmail = document.getElementById('userEmail').value;
    document.getElementById('attendanceForm').reset();
    document.getElementById('userEmail').value = savedEmail;
    document.getElementById('typeIn').checked = true;
    toggleAttendanceType();
    if (datePickerInstance) datePickerInstance.clear();
    initProjectDropdown();
    fetchGPSLocation();
  }

  function showPopup(title, message, type = "error") {
    const modal = document.getElementById('popupModal');
    const icon = document.getElementById('popupIcon');
    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupMessage').textContent = message;
    modal.className = type === "success" ? "popup-backdrop popup-success active" : "popup-backdrop popup-error active";
    icon.textContent = type === "success" ? "✓" : "!";
  }

  function closePopup() {
    document.getElementById('popupModal').classList.remove('active');
  }
</script>
</body>
</html>
