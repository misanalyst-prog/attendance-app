<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance & Leave Portal</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-slate: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-main);
      padding-bottom: 40px;
    }

    .app-header {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      color: white;
      padding: 24px 20px;
      border-radius: 0 0 24px 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
    }

    .status-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-online { background: #dcfce7; color: #166534; }
    .pill-offline { background: #fee2e2; color: #991b1b; }
    .pill-queue { background: #fef3c7; color: #92400e; display: none; }
    .pill-queue.active { display: inline-flex; }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .card-custom {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-control, .form-select {
      border-radius: 10px;
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      font-size: 0.95rem;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    #mapContainer {
      height: 180px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-top: 10px;
      z-index: 1;
    }

    .type-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .type-selector input { display: none; }

    .type-selector label {
      text-align: center;
      padding: 12px 8px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #ffffff;
    }

    .type-selector input:checked + label {
      border-color: var(--primary);
      background: #eef2ff;
      color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      font-weight: 700;
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      border: none;
      transition: background 0.2s ease;
    }

    .btn-submit:hover { background: var(--primary-hover); }

    .popup-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-card {
      background: white;
      border-radius: 20px;
      width: 90%;
      max-width: 380px;
      padding: 24px;
      text-align: center;
    }

    .popup-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }

    .popup-error .popup-icon { background: #fee2e2; color: #dc2626; }
    .popup-warning .popup-icon { background: #fef3c7; color: #d97706; }
    .popup-success .popup-icon { background: #dcfce7; color: #16a34a; }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h5 class="fw-bold mb-0">Attendance Portal</h5>
        <small class="opacity-75">Field Operations</small>
      </div>
      <div class="d-flex gap-2">
        <span id="networkBadge" class="status-pill pill-online"><span class="pulse-dot"></span> Online</span>
        <span id="queueBadge" class="status-pill pill-queue"><i data-lucide="refresh-cw" style="width: 12px;"></i> Queue: 0</span>
      </div>
    </div>
  </div>

  <div class="container" style="max-width: 520px;">
    <form id="attendanceForm">
      
      <div class="card-custom">
        <div class="mb-3">
          <label class="form-label">User Email Address</label>
          <input type="email" id="userEmail" class="form-control" placeholder="name@organization.org" required>
        </div>

        <div class="type-selector">
          <input type="radio" name="type" id="typeIn" value="Check-In" checked onclick="toggleType()">
          <label for="typeIn">Check-In</label>

          <input type="radio" name="type" id="typeOut" value="Check-Out" onclick="toggleType()">
          <label for="typeOut">Check-Out</label>

          <input type="radio" name="type" id="typeLeave" value="Leave" onclick="toggleType()">
          <label for="typeLeave">Leave</label>
        </div>

        <div class="row g-2">
          <div class="col-6 mb-3">
            <label class="form-label">Project</label>
            <select id="project" class="form-select" onchange="onProjectChange()" required>
              <option value="">-- Select --</option>
            </select>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">Organization</label>
            <select id="organization" class="form-select" onchange="onOrganizationChange()" disabled required>
              <option value="">-- Select --</option>
            </select>
          </div>
        </div>

        <div class="row g-2">
          <div class="col-6 mb-3">
            <label class="form-label">District</label>
            <select id="district" class="form-select" onchange="onDistrictChange()" disabled required>
              <option value="">-- Select --</option>
            </select>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">Union Council</label>
            <select id="unionCouncil" class="form-select" onchange="onUnionCouncilChange()" disabled required>
              <option value="">-- Select --</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <select id="fullName" class="form-select" onchange="onFullNameChange()" disabled required>
            <option value="">-- Select --</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Designation</label>
          <select id="designation" class="form-select" disabled required>
            <option value="">-- Select --</option>
          </select>
        </div>
      </div>

      <div id="leaveContainer" class="card-custom" style="display: none;">
        <div class="mb-3">
          <label class="form-label">Leave Category</label>
          <select id="leaveCategory" class="form-select">
            <option value="Casual Leave">Casual Leave</option>
            <option value="Sick Leave">Sick Leave</option>
            <option value="Annual Leave">Annual Leave</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Select Leave Date(s)</label>
          <input type="text" id="leaveDatesPicker" class="form-control" placeholder="Tap to choose dates">
        </div>
      </div>

      <div class="card-custom">
        <div id="timeContainer" class="mb-3">
          <label class="form-label">Current Timestamp</label>
          <input type="text" id="timeDisplay" class="form-control" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">GPS Coordinates</label>
          <input type="text" id="locationDisplay" class="form-control" readonly>
          <div id="mapContainer"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Remarks / Notes</label>
          <textarea id="remarks" class="form-control" rows="2" placeholder="Optional notes..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <i data-lucide="send" style="width: 18px; margin-right: 6px;"></i> Submit Attendance
        </button>
      </div>

    </form>
  </div>

  <div id="popupModal" class="popup-overlay">
    <div class="popup-card">
      <div class="popup-icon">
        <i id="popupIcon" data-lucide="alert-circle" style="width: 28px; height: 28px;"></i>
      </div>
      <h6 id="popupTitle" class="fw-bold mb-2">Notice</h6>
      <p id="popupMessage" class="text-muted small mb-4">Message content</p>
      <button class="btn btn-dark w-100 py-2 fw-bold" style="border-radius: 10px;" onclick="closePopup()">Dismiss</button>
    </div>
  </div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyLEMc5wnhuEbJXp7hP5Pmxhs4kKRU5LZABFqyd4ZnqJaWjJaVqUJhnqMFZPhXGUhFO-g/exec";

  let masterRoster = [];
  let map = null, mapMarker = null;
  let datePickerInstance = null;

  window.addEventListener('load', () => {
    lucide.createIcons();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('ServiceWorker registered:', reg.scope))
        .catch(err => console.log('ServiceWorker failed:', err));
    }

    const savedEmail = localStorage.getItem('saved_user_email');
    if (savedEmail) document.getElementById('userEmail').value = savedEmail;

    pruneLocalCache();
    updateNetworkStatus();
    initClock();
    initLeafletMap();
    initDatePicker();
    fetchGPSLocation();
    
    loadRosterData();

    if (navigator.onLine) syncOfflineQueue();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      fetchGPSLocation(true);
      if (navigator.onLine) syncOfflineQueue();
    }
  });

  window.addEventListener('online', () => { updateNetworkStatus(); syncOfflineQueue(); });
  window.addEventListener('offline', updateNetworkStatus);

  function loadRosterData() {
    const cachedRoster = localStorage.getItem('employee_roster_cache');

    if (cachedRoster) {
      masterRoster = JSON.parse(cachedRoster);
      initProjectDropdown();
      restoreSavedDropdownSelections();
    }

    if (navigator.onLine && GAS_API_URL !== "YOUR_DEPLOYED_WEB_APP_URL_HERE") {
      fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getEmployees' }) })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'SUCCESS' && res.employees && res.employees.length > 0) {
          masterRoster = res.employees;
          localStorage.setItem('employee_roster_cache', JSON.stringify(masterRoster));
          
          if (!cachedRoster) {
            initProjectDropdown();
            restoreSavedDropdownSelections();
          }
        }
      })
      .catch(() => console.log('Using offline roster cache'));
    }
  }

  function saveDropdownState(key, value) {
    localStorage.setItem(`form_${key}`, value);
  }

  function restoreSavedDropdownSelections() {
    const savedProj = localStorage.getItem('form_project');
    const savedOrg = localStorage.getItem('form_organization');
    const savedDist = localStorage.getItem('form_district');
    const savedUc = localStorage.getItem('form_unionCouncil');
    const savedName = localStorage.getItem('form_fullName');
    const savedDesig = localStorage.getItem('form_designation');

    if (savedProj) {
      document.getElementById('project').value = savedProj;
      onProjectChange(false);
    }
    if (savedOrg) {
      document.getElementById('organization').value = savedOrg;
      onOrganizationChange(false);
    }
    if (savedDist) {
      document.getElementById('district').value = savedDist;
      onDistrictChange(false);
    }
    if (savedUc) {
      document.getElementById('unionCouncil').value = savedUc;
      onUnionCouncilChange(false);
    }
    if (savedName) {
      document.getElementById('fullName').value = savedName;
      onFullNameChange(false);
    }
    if (savedDesig) {
      document.getElementById('designation').value = savedDesig;
    }
  }

  function initProjectDropdown() {
    const projects = [...new Set(masterRoster.map(e => e.project))].filter(Boolean);
    populateSelect('project', projects, '-- Select Project --');
  }

  function onProjectChange(resetChildKeys = true) {
    const proj = document.getElementById('project').value;
    saveDropdownState('project', proj);
    if (resetChildKeys) clearChildSelections(['organization', 'district', 'unionCouncil', 'fullName', 'designation']);

    const filtered = masterRoster.filter(e => e.project === proj);
    populateSelect('organization', [...new Set(filtered.map(e => e.organization))].filter(Boolean), '-- Select Organization --');
    document.getElementById('organization').disabled = false;
  }

  function onOrganizationChange(resetChildKeys = true) {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    saveDropdownState('organization', org);
    if (resetChildKeys) clearChildSelections(['district', 'unionCouncil', 'fullName', 'designation']);

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org);
    populateSelect('district', [...new Set(filtered.map(e => e.district))].filter(Boolean), '-- Select District --');
    document.getElementById('district').disabled = false;
  }

  function onDistrictChange(resetChildKeys = true) {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    saveDropdownState('district', dist);
    if (resetChildKeys) clearChildSelections(['unionCouncil', 'fullName', 'designation']);

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist);
    populateSelect('unionCouncil', [...new Set(filtered.map(e => e.unionCouncil))].filter(Boolean), '-- Select Union Council --');
    document.getElementById('unionCouncil').disabled = false;
  }

  function onUnionCouncilChange(resetChildKeys = true) {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    saveDropdownState('unionCouncil', uc);
    if (resetChildKeys) clearChildSelections(['fullName', 'designation']);

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc);
    populateSelect('fullName', [...new Set(filtered.map(e => e.fullName))].filter(Boolean), '-- Select Full Name --');
    document.getElementById('fullName').disabled = false;
  }

  function onFullNameChange(resetChildKeys = true) {
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;
    saveDropdownState('fullName', name);

    const filtered = masterRoster.filter(e => e.project === proj && e.organization === org && e.district === dist && e.unionCouncil === uc && e.fullName === name);
    const desigs = [...new Set(filtered.map(e => e.designation))].filter(Boolean);
    
    populateSelect('designation', desigs, '-- Select Designation --');
    document.getElementById('designation').disabled = false;

    if (desigs.length === 1) {
      document.getElementById('designation').value = desigs[0];
      saveDropdownState('designation', desigs[0]);
    }
  }

  function clearChildSelections(keys) {
    keys.forEach(k => localStorage.removeItem(`form_${k}`));
  }

  function latLngToTile(lat, lng, zoom) {
    const latRad = (lat * Math.PI) / 180;
    const n = Math.pow(2, zoom);
    const xTile = Math.floor(((lng + 180) / 360) * n);
    const yTile = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
    return { x: xTile, y: yTile };
  }

  function prefetchMapTiles(lat, lng) {
    if (!navigator.onLine) return;

    const zoomLevels = [15, 16, 17];
    const subdomains = ['a', 'b', 'c'];

    zoomLevels.forEach(zoom => {
      const centerTile = latLngToTile(lat, lng, zoom);

      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const x = centerTile.x + dx;
          const y = centerTile.y + dy;
          const sub = subdomains[Math.abs(x + y) % subdomains.length];
          const tileUrl = `https://${sub}.tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
          fetch(tileUrl, { mode: 'no-cors' }).catch(() => {});
        }
      }
    });
  }

  function fetchGPSLocation(forceRefresh = false) {
    const locInput = document.getElementById('locationDisplay');
    locInput.value = "Acquiring GPS coordinates...";

    if (!navigator.onLine && !forceRefresh) {
      const cachedLoc = localStorage.getItem('cached_last_gps');
      if (cachedLoc) {
        locInput.value = cachedLoc;
        const parts = cachedLoc.split(',');
        if (parts.length === 2) updateMapMarker(parseFloat(parts[0]), parseFloat(parts[1]));
        return;
      }
    }

    if (!("geolocation" in navigator)) {
      locInput.value = "GPS Not Supported";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const formattedLoc = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        locInput.value = formattedLoc;
        localStorage.setItem('cached_last_gps', formattedLoc);
        updateMapMarker(lat, lng);

        prefetchMapTiles(lat, lng);
      },
      () => {
        const cachedLoc = localStorage.getItem('cached_last_gps');
        locInput.value = cachedLoc ? cachedLoc : "GPS Access Denied";
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: forceRefresh ? 0 : 5000 }
    );
  }

  function initLeafletMap() {
    map = L.map('mapContainer', { zoomControl: false }).setView([20.0, 0.0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  }

  function updateMapMarker(lat, lng) {
    if (!map) return;
    map.setView([lat, lng], 16);
    if (mapMarker) mapMarker.setLatLng([lat, lng]);
    else mapMarker = L.marker([lat, lng]).addTo(map);
  }

  function getTodayStr() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  }

  function getCurrentMonthYearStr() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  }

  function getLocalLogs() {
    return JSON.parse(localStorage.getItem('user_attendance_logs') || '[]');
  }

  function pruneLocalCache() {
    let logs = getLocalLogs();
    const todayStr = getTodayStr();
    const currentMY = getCurrentMonthYearStr();

    logs = logs.filter(r => {
      const isLeave = r.type && r.type.startsWith('Leave');
      if (isLeave) {
        const dateParts = r.time.split(' ')[0].split('/');
        return dateParts.length === 3 && `${dateParts[1]}/${dateParts[2]}` === currentMY;
      } else {
        return r.time.startsWith(todayStr);
      }
    });

    localStorage.setItem('user_attendance_logs', JSON.stringify(logs));
    return logs;
  }

  function saveLocalLog(record) {
    let logs = getLocalLogs();
    logs.push(record);
    localStorage.setItem('user_attendance_logs', JSON.stringify(logs));
    pruneLocalCache();
  }

  function validateLocally(record) {
    const todayStr = getTodayStr();
    const logs = pruneLocalCache().filter(r => r.fullName.toLowerCase() === record.fullName.toLowerCase());

    if (record.type === 'Leave') {
      const leaveDates = record.leaveDates || [];
      for (let targetDate of leaveDates) {
        const hasLeave = logs.some(r => r.time.startsWith(targetDate) && r.type.startsWith('Leave'));
        if (hasLeave) {
          return { valid: false, title: "Leave Conflict", message: `Leave record already exists for ${record.fullName} on ${targetDate}.` };
        }
      }
      return { valid: true };
    }

    const todayLogs = logs.filter(r => r.time.startsWith(todayStr));
    const hasLeaveToday = todayLogs.some(r => r.type.startsWith('Leave'));
    const hasCheckInToday = todayLogs.some(r => r.type === 'Check-In');
    const hasCheckOutToday = todayLogs.some(r => r.type === 'Check-Out');

    if (hasLeaveToday) {
      return { valid: false, title: "Submission Blocked", message: `${record.fullName} is registered on Leave for today (${todayStr}).` };
    }

    if (record.type === 'Check-In') {
      const now = new Date();
      if (now.getHours() > 9 || (now.getHours() === 9 && (now.getMinutes() > 0 || now.getSeconds() > 0))) {
        return { valid: false, title: "Check-In Window Closed", message: "Check-In time window closes strictly at 09:00 AM." };
      }
      if (hasCheckInToday) {
        return { valid: false, title: "Already Checked-In", message: `${record.fullName} has already checked in for today (${todayStr}).` };
      }
    }

    if (record.type === 'Check-Out') {
      if (!hasCheckInToday) {
        return { valid: false, title: "Check-Out Denied", message: `No Check-In record found for ${record.fullName} today (${todayStr}). You must Check-In first.` };
      }
      if (hasCheckOutToday) {
        return { valid: false, title: "Already Checked-Out", message: `${record.fullName} has already checked out for today (${todayStr}).` };
      }
    }

    return { valid: true };
  }

  document.getElementById('attendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('userEmail').value.trim();
    localStorage.setItem('saved_user_email', email);
    const locVal = document.getElementById('locationDisplay').value;

    if (!email) {
      showPopup("Email Missing", "Please enter a valid email address.", "error");
      return;
    }

    if (!locVal || locVal.includes("Acquiring") || locVal.includes("Denied") || locVal.includes("Supported")) {
      showPopup("Location Error", "Please capture GPS coordinates before submitting.", "error");
      return;
    }

    const type = document.querySelector('input[name="type"]:checked').value;
    const proj = document.getElementById('project').value;
    const org = document.getElementById('organization').value;
    const dist = document.getElementById('district').value;
    const uc = document.getElementById('unionCouncil').value;
    const name = document.getElementById('fullName').value;
    const desig = document.getElementById('designation').value;
    const remarks = document.getElementById('remarks').value;
    const currentTimeFormatted = document.getElementById('timeDisplay').value;

    let record = {
      uid: 'UID-' + Date.now(),
      email: email,
      project: proj,
      organization: org,
      district: dist,
      unionCouncil: uc,
      fullName: name,
      designation: desig,
      type: type,
      time: currentTimeFormatted,
      submissionTime: currentTimeFormatted,
      location: locVal,
      remarks: remarks
    };

    if (type === 'Leave') {
      const selectedDatesStr = document.getElementById('leaveDatesPicker').value;
      if (!selectedDatesStr) {
        showPopup("Dates Required", "Please select leave date(s) on the calendar picker.", "warning");
        return;
      }
      const leaveDates = selectedDatesStr.split(', ').map(d => d.trim());
      record.leaveCategory = document.getElementById('leaveCategory').value;
      record.leaveDates = leaveDates;
      record.time = `${leaveDates[0]} 09:00:00`;
    }

    const localCheck = validateLocally(record);
    if (!localCheck.valid) {
      showPopup(localCheck.title, localCheck.message, "error");
      return;
    }

    if (type === 'Leave') {
      record.leaveDates.forEach(d => {
        saveLocalLog({ ...record, type: `Leave (${record.leaveCategory})`, time: `${d} 09:00:00` });
      });
    } else {
      saveLocalLog(record);
    }

    if (navigator.onLine && GAS_API_URL !== "YOUR_DEPLOYED_WEB_APP_URL_HERE") {
      sendToServerDirectly(record);
    } else {
      saveLocallyOffline(record);
      showPopup("Saved Offline", "No active connection. Entry queued locally and will sync automatically when online.", "warning");
      resetForm();
    }
  });

  function sendToServerDirectly(record) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Submitting...`;

    fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'submitAttendance', record: record })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="send" style="width: 18px;"></i> Submit Attendance`;
      lucide.createIcons();

      if (res.status === 'SUCCESS' || res.status === 'SUCCESS_LEAVE') {
        showPopup("Submitted Successfully", `Entry recorded for ${record.fullName}.`, "success");
        resetForm();
      } else {
        saveLocallyOffline(record);
        showPopup("Queued Offline", res.message || "Server issue encountered. Saved locally.", "warning");
        resetForm();
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="send" style="width: 18px;"></i> Submit Attendance`;
      lucide.createIcons();
      saveLocallyOffline(record);
      showPopup("Saved Offline", "Connection timeout. Queued locally for background sync.", "warning");
      resetForm();
    });
  }

  function saveLocallyOffline(record) {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    queue.push(record);
    localStorage.setItem('offline_attendance_queue', JSON.stringify(queue));
    updateQueueBadge();
  }

  async function syncOfflineQueue() {
    let queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    if (queue.length === 0 || GAS_API_URL === "YOUR_DEPLOYED_WEB_APP_URL_HERE") return;

    let remainingQueue = [];
    let syncedCount = 0;

    for (const record of queue) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitAttendance', record: record })
        });
        const res = await response.json();
        if (res.status === 'SUCCESS' || res.status === 'SUCCESS_LEAVE') syncedCount++;
        else remainingQueue.push(record);
      } catch (err) {
        remainingQueue.push(record);
      }
    }

    localStorage.setItem('offline_attendance_queue', JSON.stringify(remainingQueue));
    updateQueueBadge();
    if (syncedCount > 0) showPopup("Sync Complete", `${syncedCount} queued record(s) synced to Google Sheets.`, "success");
  }

  function initDatePicker() {
    datePickerInstance = flatpickr("#leaveDatesPicker", {
      mode: "multiple", dateFormat: "d/m/Y", conjunction: ", ", minDate: "today"
    });
  }

  function toggleType() {
    const isLeave = document.getElementById('typeLeave').checked;
    document.getElementById('leaveContainer').style.display = isLeave ? 'block' : 'none';
    document.getElementById('timeContainer').style.display = isLeave ? 'none' : 'block';
  }

  function initClock() {
    setInterval(() => {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('timeDisplay').value = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }, 1000);
  }

  function updateNetworkStatus() {
    const statusEl = document.getElementById('networkBadge');
    statusEl.className = navigator.onLine ? "status-pill pill-online" : "status-pill pill-offline";
    statusEl.innerHTML = navigator.onLine ? `<span class="pulse-dot"></span> Online` : `<span class="pulse-dot"></span> Offline`;
    updateQueueBadge();
  }

  function updateQueueBadge() {
    const queue = JSON.parse(localStorage.getItem('offline_attendance_queue') || '[]');
    const badge = document.getElementById('queueBadge');
    badge.className = queue.length > 0 ? "status-pill pill-queue active" : "status-pill pill-queue";
    badge.innerHTML = `<i data-lucide="refresh-cw" style="width: 12px;"></i> Queue: ${queue.length}`;
    lucide.createIcons();
  }

  function populateSelect(id, items, placeholder) {
    const el = document.getElementById(id);
    el.innerHTML = `<option value="">${placeholder}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
  }

  function resetForm() {
    const currentEmail = document.getElementById('userEmail').value;
    document.getElementById('attendanceForm').reset();
    document.getElementById('userEmail').value = currentEmail;
    document.getElementById('typeIn').checked = true;
    toggleType();
    if (datePickerInstance) datePickerInstance.clear();
    restoreSavedDropdownSelections();
    fetchGPSLocation();
  }

  function showPopup(title, message, type = "error") {
    const modal = document.getElementById('popupModal');
    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupMessage').textContent = message;
    modal.className = `popup-overlay popup-${type} active`;

    const iconEl = document.getElementById('popupIcon');
    if (type === "success") iconEl.setAttribute('data-lucide', 'check-circle-2');
    else if (type === "warning") iconEl.setAttribute('data-lucide', 'alert-triangle');
    else iconEl.setAttribute('data-lucide', 'alert-circle');
    
    lucide.createIcons();
  }

  function closePopup() { document.getElementById('popupModal').classList.remove('active'); }
</script>
</body>
</html>
